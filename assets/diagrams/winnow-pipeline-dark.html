<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How winnow reads a saved post</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · winnow</p>
    <h1>How winnow reads a saved post</h1>

      <desc id="pipeline-dark-desc">Architecture diagram: a saved Instagram post is opened slide by slide, a vision model extracts the names it mentions, each name is checked against GitHub or Hugging Face, and only verified facts are written to the findings file. A spend brake can halt the run.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <line x1="264" y1="240" x2="312" y2="240" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="456" y1="240" x2="504" y2="240" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="648" y1="240" x2="696" y2="240" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="384" y1="344" x2="384" y2="284" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <rect x="200" y="140" width="48" height="12" rx="2" fill="#2d3142"/>

      <rect x="392" y="308" width="48" height="12" rx="2" fill="#2d3142"/>
      <text x="416" y="316" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HALTS</text>

      <rect x="112" y="48" width="160" height="64" rx="6" fill="#2d3142"/>
      <rect x="112" y="48" width="160" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>

      <rect x="476" y="48" width="200" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>

      <text x="576" y="104" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stars · commits · downloads</text>

      <rect x="120" y="196" width="144" height="88" rx="6" fill="#2d3142"/>

      <text x="192" y="272" fill="#8e98ac" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Playwright · Chromium</text>

      <rect x="312" y="196" width="144" height="88" rx="6" fill="#2d3142"/>

      <text x="384" y="256" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the names it mentions</text>
      <text x="384" y="272" fill="#8e98ac" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Claude Haiku · vision</text>

      <rect x="504" y="196" width="144" height="88" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1"/>
      <rect x="512" y="204" width="28" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>

      <text x="576" y="240" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify</text>
      <text x="576" y="256" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">does it still exist?</text>
      <text x="576" y="272" fill="#8e98ac" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GitHub · HF · llmfit</text>

      <rect x="696" y="196" width="144" height="88" rx="6" fill="#2d3142"/>
      <rect x="696" y="196" width="144" height="88" rx="6" fill="rgba(0,0,0,0.22)" stroke="#bfc0c0" stroke-width="1"/>
      <rect x="704" y="204" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.40)" stroke-width="0.8"/>
      <text x="720" y="212" fill="#8e98ac" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>
      <text x="768" y="240" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Findings file</text>

      <text x="768" y="272" fill="#8e98ac" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">facts, not opinions</text>

      <rect x="312" y="344" width="144" height="64" rx="6" fill="#2d3142"/>

      <line x1="40" y1="456" x2="920" y2="456" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <text x="40" y="476" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <text x="220" y="500" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Run by winnow</text>
      <rect x="320" y="492" width="14" height="10" rx="2" fill="rgba(0,0,0,0.22)" stroke="#bfc0c0" stroke-width="1"/>
      <text x="340" y="500" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">File on disk</text>
      <rect x="436" y="492" width="14" height="10" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="456" y="500" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Outside winnow</text>
      <line x1="564" y1="497" x2="592" y2="497" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="600" y="500" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Spend brake</text>

  </div>
</body>
</html>
