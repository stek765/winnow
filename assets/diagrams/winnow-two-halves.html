<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The two halves of winnow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · winnow</p>
    <h1>The two halves of winnow</h1>

    <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="halves-title halves-desc">
      <title id="halves-title">The two halves of winnow</title>
      <desc id="halves-desc">Architecture diagram: a dashed boundary separates the collector, which runs nightly and writes verified facts to a findings file, from the judge — you and a model reading those facts against your own profile to produce the weekly recap.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="616" y1="64" x2="616" y2="360" stroke="#7a8399" stroke-width="1" stroke-dasharray="6,4" opacity="0.7"/>

      <text x="64" y="48" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">THE COLLECTOR · CODE · THIS REPO</text>

      <text x="704" y="48" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">THE JUDGE · YOU + A MODEL</text>

      <line x1="256" y1="268" x2="336" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="528" y1="268" x2="704" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="800" y1="168" x2="800" y2="224" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="272" y="248" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="296" y="256" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITES</text>

      <rect x="536" y="248" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="256" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FACTS</text>

      <rect x="808" y="184" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="836" y="192" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONTEXT</text>

      <rect x="64" y="224" width="192" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="224" width="192" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="232" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="86" y="240" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
      <text x="160" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">winnow collect</text>
      <text x="160" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nightly, unattended</text>
      <text x="160" y="300" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the same for anyone</text>

      <rect x="336" y="224" width="192" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="336" y="224" width="192" height="88" rx="6" fill="rgba(45,49,66,0.07)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="344" y="232" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="360" y="240" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>
      <text x="432" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Findings file</text>
      <text x="432" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">findings/*.json</text>
      <text x="432" y="300" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">facts, no opinions</text>

      <rect x="704" y="224" width="192" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="224" width="192" height="88" rx="6" fill="rgba(45,49,66,0.07)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="712" y="232" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="726" y="240" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="800" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">The weekly recap</text>
      <text x="800" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keep · throw out · why</text>
      <text x="800" y="300" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docs/recap-prompt.md</text>

      <rect x="704" y="80" width="192" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="80" width="192" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="712" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="726" y="96" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YOU</text>
      <text x="800" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Your profile</text>
      <text x="800" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">what you already ruled out</text>
      <text x="800" y="156" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">profiles/yours.md</text>

      <line x1="40" y1="392" x2="920" y2="392" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="412" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="428" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="436" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Yours — nobody else's</text>
      <rect x="200" y="428" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="436" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">General — in the repo</text>
      <rect x="360" y="428" width="14" height="10" rx="2" fill="rgba(45,49,66,0.07)" stroke="#4f5d75" stroke-width="1"/>
      <text x="380" y="436" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">File on disk</text>
      <line x1="476" y1="433" x2="504" y2="433" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="512" y="436" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Where the code stops</text>
    </svg>
  </div>
</body>
</html>
