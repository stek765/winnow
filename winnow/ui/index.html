const LANGS = [
  { id: "en", name: "English", why: "The default." },
  { id: "it", name: "Italiano", why: "Con le date scritte all'italiana." },
];

function lang() {
  const l = document.documentElement.getAttribute("lang");
  return LANGS.some((x) => x.id === l) ? l : "en";
}

// One string, filled in. `{name}` in the text, `{name: value}` in the call —
// the same shape as the Python side, so a key can be moved between them.
function _(key, vars) {
  const row = T[key];
  if (!row) return key;
  const text = row[lang() === "it" ? 1 : 0] || row[0];
  return vars
    ? text.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m))
    : text;
}

// The markup carries keys; this fills them in. Called once at boot and again
// whenever the language changes, so nothing has to be rebuilt by hand.
function applyLang() {
  document.documentElement.setAttribute("lang", lang());
  document.querySelectorAll("[data-t]").forEach(
    (e) => (e.textContent = _(e.dataset.t)));
  document.querySelectorAll("[data-t-html]").forEach(
    (e) => (e.innerHTML = _(e.dataset.tHtml)));
  document.querySelectorAll("[data-t-title]").forEach(
    (e) => e.setAttribute("title", _(e.dataset.tTitle)));
  document.querySelectorAll("[data-t-aria]").forEach(
    (e) => e.setAttribute("aria-label", _(e.dataset.tAria)));
}


// The shell says so in the URL. Sniffing the user agent would be guessing:
// the same page is served to a browser tab, where there are no traffic lights
// to make room for and the band would just be a dent in the top of the page.
if (new URLSearchParams(location.search).get("native")) {
  document.documentElement.classList.add("native");
}
let job = null, timer = null;
// The clock beside the phase, and when the run began. Declared here with the
// rest of the run's state: `startJob` assigned both without either existing,
// so the very first press threw «ticker is not defined» *before* it started
// polling — the server did the work, the window sat still saying nothing, and
// the result turned up minutes later out of the four-second refresh. A run
// that has begun and a window that never noticed is the worst shape this app
// can be in, and it is the shape an undeclared variable put it in.
let ticker = null, started = 0;

// A log can say nothing for three minutes while a model thinks, and a run
// that has gone quiet looks exactly like a run that has died. The clock is
// the one thing that keeps moving through the wait.
function tick() {
  if (!started) return;
  const s = Math.round((Date.now() - started) / 1000);
  $("clock").textContent =
    `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

// The grains are built here rather than written out in the markup: each one
// needs its own start, speed and delay, and eight hand-written style
// attributes would be eight things to keep in step by hand.
(function chaff() {
  const box = document.getElementById("chaff");
  for (let i = 0; i < 9; i++) {
    const g = document.createElement("span");
    g.style.left = (4 + Math.random() * 46) + "vw";
    g.style.top = (52 + Math.random() * 46) + "vh";
    // Long and staggered: a burst of grains crossing together would read as
    // an effect, and the point is weather, not an animation.
    g.style.animationDuration = (26 + Math.random() * 22) + "s";
    g.style.animationDelay = (-Math.random() * 40) + "s";
    g.style.transform = "rotate(" + (Math.random() * 180) + "deg)";
    box.appendChild(g);
  }
})();

async function api(path, method = "GET", payload) {
  const r = await fetch(path, payload === undefined ? { method } : {
    method, headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  return { code: r.status, body: await r.json().catch(() => ({})) };
}

async function post(path, payload) {
  const r = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  return { code: r.status, body: await r.json().catch(() => ({})) };
}

// --- home ------------------------------------------------------------------
function paintHome(s) {
  $("face").className = "home s-" + s.state;
  $("dot").textContent = T[`state.${s.state}`] ? _(`state.${s.state}`)
                                                : s.state;
  $("headline").textContent = s.headline;
  $("detail").textContent = s.detail || "";

  const act = $("act");
  act.disabled = false;
  act.dataset.action = s.action;
  act.innerHTML = s.button + '<span class="arrow">&rarr;</span>';

  const also = $("also");
  also.hidden = !s.also;
  if (s.also) {
    also.disabled = false;
    also.textContent = s.also_button || "Raccogli ora";
    also.dataset.action = s.also;
  }

  const stale = s.stale
    ? `<span class="stat warn"><b>!</b>${_("home.stale")}</span>` : "";
  // No count of days here any more: the line under the headline names them,
  // and repeating the same fact in a unit that does not say what it counts is
  // what made «3 GIORNI» unreadable.
  $("stats").innerHTML =
    `<span class="stat"><b>${s.pending_posts}</b>${_("home.queued")}</span>` +
    `<span class="stat"><b>$${(s.spend_usd || 0).toFixed(2)}</b>` +
    `${_("home.this_week")}</span>` +
    stale;
}

// One run at a time — the engine refuses a second with a 409, and it is
// right to. What was missing is the window's half: the other buttons looked
// as pressable as ever, and pressing one did nothing a reader could see.
//
// Dimmed, and still clickable. A disabled button swallows the press, and a
// press that vanishes reads as an app that is broken rather than one that is
// busy — so the click goes through and is answered in words.
let busy = false;
// The job the engine says is running, which is not always the one this window
// started: the daily run comes from the scheduler.
let running = null;

function setBusy(on) {
  if (busy === on) return;
  busy = on;
  // `dream` only. `act` becomes «Ferma» while something runs — the one
  // control that must still look pressable — and `also` is hidden. The
  // dimming is for the button on the *other* screen, which otherwise looks
  // exactly as it does when nothing is happening.
  $("dream").classList.toggle("busy", on);
  if (!on) hideRefusal();
}

function hideRefusal() {
  $("dream-note").hidden = true;
}

// Said beside the button that was pressed, never in the log on another
// screen: «Genera idea» lives on the archive and its log is on the home
// screen, so that is where the answer used to go — out of sight.
function refuse(note) {
  $("dream-note").textContent = note || _("home.already_running");
  $("dream-note").hidden = false;
}

async function refresh() {
  const { body } = await api("/api/state");
  // From the state, not from `job`: the daily run is started by the scheduler
  // and this window never knew about it, yet it holds the engine just the
  // same.
  running = body.running_id || null;
  setBusy(body.state === "busy" || !!job);
  if (!job) paintHome(body);
}

// --- a run in flight -------------------------------------------------------
// Which element is showing this run. A run has one log, and where it is
// depends on where it was started from — not on which screen is in front.
let logId = "log";

// What a run says while it runs. `progress.line` writes the same events for
// the terminal, in English and padded into columns — right there, wrong in a
// window whose every other word is Italian. Same events, one wording each,
// and anything not listed falls back to the server's line rather than
// vanishing: a run that goes quiet is a run that looks hung.
const SAYS = {
  // Every event a run can emit needs a line here. Without one the window
  // falls back to `e.line` — the terminal's wording, a column of padded
  // English in a window where every other word follows the reader's language.
  sliced: (d) => _("say.sliced", d),
  folder: (d) => _("say.folder", d),
  post: (d) => _(d.slides === 1 ? "say.post_one" : "say.post", d),
  extracted: (d) => _("say.extracted",
    { names: (d.names || []).join(", ") || _("say.no_names") }),
  verified: (d) => (!d.checked ? _("say.unchecked", d)
    : !d.exists ? _("say.absent", d)
    : d.stars != null ? _("say.found_stars", d) : _("say.found", d)),
  written: (d) => _("say.written", d),
  halted: (d) => _("say.halted", { reason: d.reason || _("say.spend_limit") }),
  bundling: (d) => _(d.days === 1 ? "say.bundling_one" : "say.bundling", { ...d,
    chars: d.chars ? _("say.chars", { n: Math.round(d.chars / 1000) }) : "" }),
  drawing: (d) => _("say.drawing", d),
  asking: (d) => (d.attempt > 1
    ? _("say.retry", { n: d.attempt, of: d.of }) : _("say.asking")),
  // Replaces its own previous line instead of stacking: eighteen «writing» in
  // a column is a wall, and only the last one is true.
  writing: (d) => _("say.writing", { n: Math.round(d.chars / 1000) }),
  waiting: (d) => _("say.waiting", { n: Math.round(d.seconds) }),
  judged: (d) => _("say.judged", { ...d,
    binned: d.binned != null ? _("say.binned", { n: d.binned }) : "",
    sections: d.sections ? _("say.sections", { n: d.sections }) : "" }),
  dreamt: (d) => _("say.dreamt", d),
  stopped: () => _("say.stopped"),
  failed: (d) => (d.why ? _("say.failed", d) : _("say.post_skipped", d)),
  rendered: () => _("say.ready"),
};

const SAYS_DRAW = {
  drawing: () => "",
  asking: (d) => (d.attempt > 1
    ? _("say.retry", { n: d.attempt, of: d.of }) : _("say.generating")),
  dreamt: () => _("say.ready"),
};

function saying(e, kind) {
  const say = (kind === "ideas" && SAYS_DRAW[e.kind]) || SAYS[e.kind];
  try {
    return say ? say(e.data || {}) : e.line;
  } catch (err) {
    return e.line;
  }
}

// Which event means the run has moved on to which phase. The events in
// between — a name read, a name checked at the source — belong to the phase
// they happen inside and do not get one of their own.
const PHASES = {
  folder: "phase.folders",
  post: "phase.posts", extracted: "phase.reading", verified: "phase.checking",
  written: "phase.collected",
  sliced: "phase.bundling", bundling: "phase.bundling",
  writing: "phase.writing", waiting: "phase.retrying",
  drawing: "phase.drawing",
  judged: "phase.page", dreamt: "phase.page", rendered: "phase.page",
  stopped: "phase.stopped",
};

// What kind of run is going is a fact; how far along it is belongs to the
// events themselves. `of` comes only from an event that carries a real total
// — the post counter — and stays null everywhere else: a recap waiting on a
// model has no percentage, and inventing one is worse than admitting there
// is none. That is what the shuttle is for.
function phaseOf(events, kind) {
  let phase = _("phase.starting");
  let done = null, of = 0;
  (events || []).forEach((e) => {
    if (e.kind === "post") {
      done = e.data.i;
      of = e.data.n;
    }
    if (e.kind === "asking") {
      // One event, two meanings: the model is reading a whole week, or it is
      // thinking up an idea. Only the run knows which.
      phase = _(kind === "ideas" ? "phase.thinking" : "phase.reading_week");
      return;
    }
    const key = PHASES[e.kind];
    if (key) phase = _(key);
  });
  return { phase, done, of };
}

async function follow(id) {
  const { body } = await api("/api/jobs/" + id);
  const log = $(logId);
  log.hidden = false;
  // One line per event, except the ones that count up: those replace the
  // previous one of their own kind. A column of eighteen «sta scrivendo» is
  // a wall, and only the last of them is true.
  const COUNTERS = new Set(["writing"]);
  const lines = [];
  body.events.forEach((e) => {
    const text = saying(e, body.kind);
    if (!text) return;
    const last = lines[lines.length - 1];
    if (COUNTERS.has(e.kind) && last && last.kind === e.kind) {
      last.text = text;
      return;
    }
    lines.push({ kind: e.kind, text });
  });
  // Appended, never rebuilt. Rewriting `innerHTML` on every poll replayed
  // every line's entrance animation twice a second: the whole panel blinked,
  // and a blinking panel reads as a program stuck in a loop rather than one
  // doing its work.
  const kept = log.children.length;
  lines.slice(0, kept).forEach((l, i) => {
    if (log.children[i].textContent !== l.text) {
      log.children[i].textContent = l.text;      // a counter, in place
    }
  });
  lines.slice(kept).forEach((l) => {
    const line = document.createElement("p");
    line.textContent = l.text;
    log.appendChild(line);
  });
  if (lines.length > kept) log.scrollTop = log.scrollHeight;

  const { phase, done, of } = phaseOf(body.events, body.kind);
  $("work").hidden = false;
  $("phase").textContent = of && done != null
    ? _("phase.of", { phase, done, of }) : phase;
  const known = of && done != null && of > 0;
  $("gauge").classList.toggle("unknown", !known);
  $("fill").style.width = known ? `${Math.round((done / of) * 100)}%` : "";
  log.scrollTop = log.scrollHeight;

  if (body.done) {
    clearInterval(timer);
    if (ticker) { clearInterval(ticker); ticker = null; }
    job = null;
    setBusy(false);
    // The bar completes before it goes: a strip that vanishes mid-way leaves
    // the last thing a person saw as an unfinished job.
    $("gauge").classList.remove("unknown");
    $("fill").style.width = "100%";
    setTimeout(() => { if (!job) $("work").hidden = true; }, 900);
    $("dream").disabled = false;
    $("sow-die").classList.remove("rolling");
    $("sow-die").disabled = false;
    const halted = body.events.some((e) => e.kind === "stopped");
    if (halted) {
      $("sow-run-stamp").textContent = _("idea.stopped");
      $("sow-stop").hidden = true;
    } else if (body.error || body.code !== 0) {
      // A run can end badly without throwing: no key, the spend brake, a reply
      // that is not JSON. Whatever happened, the panel must stop saying it is
      // working — a window still promising "sto pescando" over a job that gave
      // up ninety seconds ago is the worst thing this app can do, and it did
      // it. The reason travels as a `failed` event; the backstop below asks
      // whether a *line* was printed, not whether an event exists, because an
      // older server can emit an event this version has no wording for.
      $("sow-run-stamp").textContent = _("idea.failed");
      // Nothing left to stop. Offering it anyway is a button that does not
      // work, next to a message saying something already did not work.
      $("sow-stop").hidden = true;
      if (body.error) {
        log.innerHTML += `<p class="bad">${body.error}</p>`;
      } else if (!body.events.some((e) => e.kind === "failed" && e.line)) {
        log.innerHTML += `<p class="bad">${_("idea.no_reason")}</p>`;
      }
    } else if (body.code === 0 && body.kind === "ideas" && !halted) {
      const page = body.events.find((e) => e.kind === "rendered");
      // Straight into the window it was already watching: the page on disk
      // stays reachable from the archive, but nobody should have to go and
      // find the thing they just paid for.
      if (page) openDraw(page.data.path.split("/").pop());
      loadArchive();
    } else if (body.code === 0 && body.kind === "recap" && !halted) {
      const page = body.events.find((e) => e.kind === "rendered");
      if (page) {
        const file = page.data.path.split("/").pop();
        // The date off the front of the name, not the name with a suffix
        // stripped: a second recap of a day lands in `…answer-2.html`, where
        // `.replace(".answer.html", "")` matches nothing and hands `sayDay`
        // the whole filename — which is how the reader's header came to read
        // «August NaN».
        openRecap(file, (file.match(/^\d{4}-\d{2}-\d{2}/) || [""])[0], "");
        document.querySelectorAll(".tab").forEach(
          (t) => t.classList.toggle("on", t.dataset.go === "archive"));
      }
      loadArchive();
    }
    refresh();
  }
}

// One place that starts a run. Two buttons on two screens start one, and the
// busy face is the same for both — a second copy of it is a second thing to
// forget to update.
async function startJob(action, headline, where, onRefusal) {
  const { code, body } = await api("/api/" + action, "POST");
  if (code !== 202) {
    const why = body.error || _("home.not_started");
    // A 409 means the engine is busy — the state the window is meant to know
    // about already. Take its word for it rather than waiting for the next
    // four-second poll to notice, or the dimming arrives after the refusal.
    if (code === 409) setBusy(true);
    // Said where the button is. `onRefusal` is passed by whoever pressed
    // something that is not on the home screen: the log lives on home, and a
    // sentence written there answers a question asked somewhere else.
    if (onRefusal) {
      onRefusal(why);
    } else {
      $("log").hidden = false;
      $("log").innerHTML = `<p class="bad">${esc(why)}</p>`;
    }
    return false;
  }
  hideRefusal();
  job = body.id;
  // Here and not only in `refresh`: the poll is skipped while this window
  // owns a job (`if (!job) refresh()`), so the dimming would have waited for
  // the run to finish, which is the one moment it is no longer needed.
  setBusy(true);
  started = Date.now();
  if (ticker) clearInterval(ticker);
  ticker = setInterval(tick, 1000);
  tick();
  logId = where || "log";
  $(logId).innerHTML = "";
  if (logId === "log") {
    $("also").hidden = true;
    $("face").className = "home s-busy";
    $("dot").textContent = _("state.busy");
    $("headline").textContent = headline;
    // Emptied on purpose: it still said «Raccolti fra il 23 e il 27 agosto»
    // under a headline announcing a run, which reads as a page that did not
    // notice the button was pressed.
    $("detail").textContent = "";
    $("act").innerHTML = _("common.stop");
    $("act").dataset.action = "stop";
    $("act").disabled = false;
  } else {
    // The home screen still says what it is doing — `refresh()` reads the
    // running job from the server — but nobody is sent there to find out.
    $("work").hidden = true;
    openSow(true);
  }
  timer = setInterval(() => follow(job), 700);
  return true;
}

$("act").addEventListener("click", async () => {
  const action = $("act").dataset.action;
  // «Ferma» is the one thing that must still work while something runs.
  if (busy && action !== "stop") {
    $("log").hidden = false;
    $("log").innerHTML = `<p class="bad">${_("home.already_running")}</p>`;
    return;
  }
  $("act").disabled = true;
  // `job || running`: a run this window started, or the one the scheduler
  // did. With only the first, «Ferma» over the daily run posted to
  // `/api/stop` — not a route — and nothing happened.
  const which = job || running;
  if (action === "stop" && which) {
    await api("/api/jobs/" + which + "/stop", "POST");
    return;
  }
  const started = await startJob(action, action === "recap"
    ? _("home.recapping") : _("home.collecting"));
  if (!started) $("act").disabled = false;
});

// --- archive ---------------------------------------------------------------
// Both, and the order goes the other way round in English: a date written
// by a rule that only knows one language reads as a translation of a date
// rather than as a date. Written in Italian only, every row of an English
// window said «28 agosto» under an English heading. Same table and same rule
// as `harvest.say_day`, which writes the dates onto the pages themselves.
const MONTHS = {
  it: ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno",
       "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"],
  en: ["January", "February", "March", "April", "May", "June", "July",
       "August", "September", "October", "November", "December"],
};

// "2026-08-24" is a serial number; "24 agosto" is a day somebody remembers.
function sayDay(iso) {
  const [y, m, d] = String(iso).split("-").map(Number);
  const months = MONTHS[lang()] || MONTHS.en;
  // `d` too, and not only the month: fed anything that is not a plain date it
  // printed «August NaN», which looks like a broken page rather than like a
  // caller passing the wrong string.
  if (!months[m - 1] || !Number.isFinite(d)) return iso;
  return lang() === "it" ? `${d} ${months[m - 1]}` : `${months[m - 1]} ${d}`;
}

// The first sentence of the week's own comment. It is the only opinion in the
// whole recap, so it is what tells two weeks apart at a glance.
function firstSentence(text) {
  const flat = String(text || "").replace(/\*\*/g, "").replace(/\s+/g, " ").trim();
  const stop = flat.search(/[.!?]\s/);
  return stop > 0 ? flat.slice(0, stop + 1) : flat;
}

const RENAME = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M11.2 2.6l2.2 2.2L5.6 12.6l-2.9.7.7-2.9z"/></svg>';

const TRASH = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
  'stroke-width="1.3" stroke-linecap="round"><path d="M3 4h10M6.5 4V2.6h3V4' +
  'M4.2 4l.6 9.2h6.4L11.8 4"/></svg>';

// The two controls on every archive row. A function and not a constant: rows
// are built by `loadArchive`, and a string evaluated once at load would keep
// whatever language the window opened in for the rest of the session — while
// `applyLang` only reaches markup that is already on the page.
const tools = () =>
  `<button class="tool pen" title="${esc(_("common.rename"))}" ` +
  `aria-label="${esc(_("common.rename"))}">${RENAME}</button>` +
  `<button class="tool bin" title="${esc(_("common.delete"))}" ` +
  `aria-label="${esc(_("common.delete"))}">${TRASH}</button>`;

let picked = new Set();
let only = "all";

// One row for a week, one for a merge — same shape, so they can live in the
// same stack and still be told apart at a glance.
function weekRow(r) {
  const score = r.kept === null || r.things === null
    ? `<span class="score">${_("archive.open_to_see")}</span>`
    : `<span class="score">` +
      _("archive.kept_of", { kept: `<b>${r.kept}</b>`, of: r.things }) +
      (r.posts ? " &middot; " + _("archive.n_posts", { n: r.posts }) : "") +
      "</span>";
  // Outside `.body`, so it is a column of its own: on the title's baseline it
  // hung from the first line of a row two lines tall, and the prices drifted
  // apart as the rows changed height.
  const cost = `<span class="cost">${r.usd ? "$" + r.usd.toFixed(2) : ""}</span>`;
  const said = r.comment
    ? `<p class="said">${esc(firstSentence(r.comment))}</p>` : "";
  // The date never stops being shown. A name given by hand is what makes a
  // shelf findable a month later; a name *instead of* the date would make the
  // same shelf impossible to put in order.
  const named = r.named
    ? `<b>${esc(r.named)}</b><span class="when">${sayDay(r.week)}</span>`
    : `<b>${sayDay(r.week)}</b>`;
  return `<div class="card" data-file="${r.file}" data-week="${r.week}" ` +
    `data-kind="week" data-title="${esc(r.named || "")}" ` +
    `data-score="${r.kept === null ? "" : esc(
      _("archive.kept_of", { kept: r.kept, of: r.things }))}">` +
    '<span class="box"></span><span class="body">' +
    `<span class="top">${named}${score}</span>` +
    said + "</span>" + cost + tools() + "</div>";
}

function mergeRow(m) {
  return `<div class="card merge" data-file="${m.file}" data-week="" ` +
    `data-kind="merge" data-label="${esc(m.named || m.label)}" ` +
    `data-title="${esc(m.named || "")}" ` +
    `data-score="${m.things ? esc(_("archive.n_things", { n: m.things })) : ""}">` +
    '<span class="gap"></span><span class="body"><span class="top">' +
    `<b>${esc(m.named || m.label)}</b>` +
    (m.named ? `<span class="when">${esc(m.label)}</span>` : "") +
    (m.things
      ? `<span class="score">` +
        _("archive.n_things", { n: `<b>${m.things}</b>` }) + "</span>" : "") +
    "</span>" +
    // The second line of a merge row, which the label had left empty: the
    // row was the same height as the others and looked misaligned because
    // there was nothing on it. The tag says what kind of row this is — the
    // one thing the tint alone was saying, and only to somebody who had
    // already worked the tint out. The days follow it when the label is a
    // name rather than the list itself, so the fact is never printed twice.
    `<p class="said"><span class="kind">${_("archive.kind_merge")}</span>` +
    (m.weeks.length && !m.lists_days ? esc(weekList(m.weeks)) : "") +
    "</p>" +
    "</span>" +
    // Not "settimane": the pages merged are recaps, and a recap is a day.
    `<span class="cost">` +
    (m.weeks.length ? _("archive.n_recaps", { n: m.weeks.length }) : "") +
    "</span>" + tools() + "</div>";
}

// A draw is neither a week nor a merge: nothing was judged and nothing was
// put together. It carries the note the model opened with, which is the only
// thing that tells one draw from another before opening it.
// An idea is called by its name. «Idee del 27 agosto» is a filing date, and
// filing dates are what makes a shelf unsearchable a month later.
// An idea is not a week, and the shared row was making it look like one: a
// title, then two mono words, then a price, all on the same baseline and all
// shouting the same amount. Here the title is alone on its line, the two
// facts that decide whether the rest gets read sit under it as chips, and
// what it cost — a cent, the same on every row — goes as quiet as it is.
// The three the prompt allows, and the class each one paints with. The value
// is a key: it stays Italian whatever language the answer came back in, for
// the same reason a verdict does — it is what the colour hangs off, and a key
// that moved with the language would repaint every page ever made.
const HARD = { facile: "easy", media: "mid", tosta: "hard" };
// A difficulty the model invented has no row in the table, and `_` falls
// back to the key — so it would print `difficulty.impossibile`. The raw word
// is the honest answer there, exactly as `say_verdict` does on the page.
const sayHard = (v) => {
  if (!v) return "";
  const said = _("difficulty." + v);
  return said === "difficulty." + v ? v : said;
};

function ideasRow(r) {
  const name = r.title || _("archive.ideas_of", { day: sayDay(r.day) });
  const chips =
    (r.difficulty
      ? `<span class="chip ${HARD[r.difficulty] || ""}">` +
        `${esc(sayHard(r.difficulty))}</span>` : "") +
    (r.time ? `<span class="chip time">${esc(r.time)}</span>` : "") +
    (r.ideas > 1
      ? `<span class="chip">${_("archive.n_ideas", { n: r.ideas })}</span>` : "") +
    `<span class="chip day">${sayDay(r.day)}</span>`;
  return `<div class="card ideas" data-file="${r.file}" data-week="" ` +
    `data-kind="ideas" data-label="${esc(r.named || name)}" ` +
    `data-title="${esc(r.named || "")}" ` +
    `data-score="${esc([sayHard(r.difficulty), r.time]
      .filter(Boolean).join(" · "))}">` +
    '<span class="gap"></span><span class="body">' +
    `<span class="top"><b>${esc(r.named || name)}</b>` +
    (r.named ? `<span class="when">${esc(name)}</span>` : "") +
    "</span>" +
    (r.gist || r.note
      ? `<p class="said">${esc(firstSentence(r.gist || r.note))}</p>` : "") +
    `<span class="facts">${chips}</span>` +
    "</span>" +
    `<span class="cost">${r.usd ? "$" + r.usd.toFixed(2) : ""}</span>` +
    tools() + "</div>";
}

async function loadArchive() {
  const { body } = await api("/api/recaps");
  picked = new Set();

  $("archive-body").innerHTML = body.items.length
    ? '<div class="cards">' + body.items.map(
        (i) => (i.kind === "merge" ? mergeRow(i)
              : i.kind === "ideas" ? ideasRow(i) : weekRow(i))).join("") + "</div>"
    : "";

  document.querySelectorAll(".card").forEach((c) => {
    c.addEventListener("click", (e) => {
      // Any control of the row's own, not just the bin: clicking the pencil
      // used to rename *and* open the page underneath it.
      if (e.target.closest(".tool")) return;
      if (e.target.closest(".box")) return toggle(c);
      if (c.dataset.kind === "ideas") return openDraw(c.dataset.file);
      openRecap(c.dataset.file, c.dataset.week, c.dataset.score,
                c.dataset.label);
    });
    c.querySelector(".bin").addEventListener("click", () => remove(c));
    c.querySelector(".pen").addEventListener("click", () => rename(c));
  });
  applyFilter();
  paintTray();
}

// One sentence per filter: «nothing here» is a different fact depending on
// which button is pressed.
const NOTHING = { all: "empty.all", week: "empty.week",
                  ideas: "empty.ideas", merge: "empty.merge" };

// Renamed in place: the row becomes an input where its title is, and nothing
// else on the screen moves. A dialog for one short string is a dialog nobody
// bothers to open a second time.
function rename(card) {
  const slot = card.querySelector(".top b");
  if (!slot || card.querySelector(".rename")) return;
  const was = card.dataset.title || "";
  const box = document.createElement("input");
  box.className = "rename";
  box.type = "text";
  box.maxLength = 60;
  box.value = was;
  box.placeholder = slot.textContent;
  slot.replaceWith(box);
  box.focus();
  box.select();

  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    const title = save ? box.value.trim() : was;
    if (save && title !== was) {
      const { code, body } = await api("/api/name/" + card.dataset.file,
                                       "PATCH", { title });
      if (code !== 200) box.placeholder = body.error || _("archive.not_renamed");
    }
    loadArchive();
  };
  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter") finish(true);
    if (e.key === "Escape") finish(false);
  });
  box.addEventListener("blur", () => finish(true));
  box.addEventListener("click", (e) => e.stopPropagation());
}

function applyFilter() {
  // «Tutto» is the recap history. An idea is not a recap of anything — it was
  // drawn out of them — and mixed into that stack it reads as one more week
  // that happened. It has a section, and it stays in it.
  document.querySelectorAll(".card").forEach((c) => {
    c.hidden = only === "all"
      ? c.dataset.kind === "ideas"
      : c.dataset.kind !== only;
  });
  document.querySelectorAll(".f").forEach(
    (f) => f.classList.toggle("on", f.dataset.only === only));
  // A filter that hides every row used to leave a blank half-screen, which
  // reads as a page that failed rather than as a shelf with nothing on it.
  const shown = [...document.querySelectorAll(".card")].filter((c) => !c.hidden);
  $("key").hidden = only === "ideas";
  const empty = $("archive-empty");
  empty.hidden = shown.length > 0;
  empty.textContent = _(NOTHING[only] || NOTHING.all);
  const cards = document.querySelector(".cards");
  if (cards) cards.hidden = shown.length === 0;
}

document.querySelectorAll(".f").forEach((f) =>
  f.addEventListener("click", () => {
    only = f.dataset.only;
    // Filtering away a chosen week would leave it chosen and invisible, and
    // the merge would then take in something the reader cannot see. Any
    // filter that hides the weeks does it, not just the one that used to.
    if (only !== "all" && only !== "week") $("tray-clear").click();
    applyFilter();
    // Back to the top. Scrolled down nine ideas and then asked for the one
    // merge, the list got shorter than the scroll position and the view
    // lurched — a page jumping under the pointer at the moment of a click.
    // A different filter is a different list, and a list starts at its start.
    $("archive").scrollTop = 0;
  }));

$("dream").addEventListener("click", async () => {
  if (busy) { refuse(); return; }
  hideRefusal();
  $("dream").disabled = true;
  if (!await startJob("ideas", _("home.drawing"), "sow-log", refuse)) {
    $("dream").disabled = false;
  }
});

$("also").addEventListener("click", async () => {
  if (busy) {
    $("log").hidden = false;
    $("log").innerHTML = `<p class="bad">${_("home.already_running")}</p>`;
    return;
  }
  $("also").disabled = true;
  $("act").disabled = true;
  if (!await startJob($("also").dataset.action, _("home.collecting"))) {
    $("also").disabled = false;
    $("act").disabled = false;
  }
});

$("sow-stop").addEventListener("click", async () => {
  if (job) await api("/api/jobs/" + job + "/stop", "POST");
});

// --- the draw's window -----------------------------------------------------
// The grain going past. Built once per opening and thrown away with it: a
// dozen elements animating behind a closed window is a laptop fan for nothing.
function weather() {
  const sky = $("sky");
  sky.innerHTML = "";
  for (let i = 0; i < 16; i++) {
    const seed = document.createElement("span");
    seed.className = "seed";
    // Slower ones sit lower and smaller: the same trick as parallax, and it
    // is what stops sixteen identical dots from reading as a progress bar.
    const far = Math.random();
    seed.style.top = `${6 + Math.random() * 78}%`;
    seed.style.animationDuration = `${5 + far * 9}s`;
    seed.style.animationDelay = `${-Math.random() * 12}s`;
    // Depth: the near ones are bigger, brighter and faster. All sixteen at
    // one size read as a row of dots, which is a progress bar nobody asked for.
    const size = 0.7 + (1 - far) * 1.5;
    seed.style.width = `${3 * size}px`;
    seed.style.height = `${7 * size}px`;
    seed.style.opacity = 0.3 + (1 - far) * 0.55;
    sky.appendChild(seed);
  }
}

let leaves = [], leaf = 0;

function openSow(running) {
  $("sow").hidden = false;
  weather();
  $("sow-run").hidden = !running;
  $("sow-card").hidden = !!running;
  if (running) {
    $("sow-run-stamp").textContent = _("idea.drawing");
    $("sow-stop").hidden = false;
  }
  $("sow-flip").hidden = true;
  if (running) $("sow-log").innerHTML = "";
}

function closeSow() {
  $("sow").hidden = true;
  $("sky").innerHTML = "";          // stop the animation behind a closed door
}

// One idea per page, and the leftovers as the last one — they are part of the
// answer, not a footnote to it: they say what the draw could not use.
async function openDraw(file) {
  const { code, body } = await api("/api/draw/" + file);
  if (code !== 200) {
    // The page on disk still opens; only this reading of it is missing.
    openRecap(file, "", "", "Idee");
    return;
  }
  const many = (body.ideas_list || []).length > 1;
  leaves = (body.ideas_list || []).map((idea, i) => ({
    // One idea needs no counter. A page of them, from before the ask
    // changed, still does.
    stamp: many ? _("idea.n_of", { i: String(i + 1).padStart(2, "0"),
                                   n: body.ideas_list.length })
                : _("idea.one"),
    title: idea.title || "", uses: idea.uses || [], gist: idea.gist || "",
    difficulty: idea.difficulty || "", time: idea.time || "",
    say: idea.idea || "", step: idea.first_step || "", but: idea.shaky || "",
  }));
  if ((body.left || []).length) {
    leaves.push({
      stamp: _("idea.none_came"), title: "", uses: [], step: "", but: "",
      gone: body.left,
    });
  }
  if (!leaves.length) {
    leaves = [{ stamp: "", title: _("idea.no_ideas"), uses: [], step: "",
                but: "", say: body.note || _("idea.drew_nothing") }];
  }
  leaf = 0;
  openSow(false);
  paintLeaf();
}

function paintLeaf() {
  const l = leaves[leaf];
  $("sow-run").hidden = true;
  $("sow-card").hidden = false;
  $("sow-stamp").textContent = l.stamp;
  $("sow-title").textContent = l.title;
  $("sow-title").hidden = !l.title;
  $("sow-uses").innerHTML = (l.uses || []).map((u) => `<b>${esc(u)}</b>`).join("");
  $("sow-uses").hidden = !(l.uses || []).length;
  $("sow-gist").textContent = l.gist || "";
  $("sow-gist").hidden = !l.gist;
  $("sow-gist").classList.toggle("long", (l.gist || "").length > 175);
  // The difficulty is one of three keys, printed in the reader's language;
  // the time is the model's own words and is printed as it came.
  const meta = [[_("sheet.difficulty"), sayHard(l.difficulty)],
                [_("sheet.time"), l.time]]
    .filter(([, v]) => v);
  $("sow-meta").innerHTML = meta.map(([k, v]) =>
    `<span class="m${v === sayHard("tosta") ? " hard" : ""}"><i>${esc(k)}</i>` +
    `<b>${esc(v)}</b></span>`).join("");
  $("sow-meta").hidden = !meta.length;
  $("sow-idea").innerHTML = l.gone
    ? '<ul class="gone">' + l.gone.map((g) =>
        `<li><b>${esc(g.name || "")}</b>${esc(g.why || "")}</li>`).join("") + "</ul>"
    : esc(l.say || "");
  $("sow-step").innerHTML = l.step
    ? `<b>${esc(_("idea.first_step"))}</b>${esc(l.step)}` : "";
  $("sow-step").hidden = !l.step;
  $("sow-shaky").innerHTML = l.but
    ? `<b>${esc(_("idea.not_certain"))}</b>${esc(l.but)}` : "";
  $("sow-shaky").hidden = !l.but;
  // Folded shut on every leaf: an idea opened on the previous card would make
  // the next one arrive already read.
  const foldable = !!l.gist && !l.gone;
  $("sow-more").hidden = !foldable;
  $("sow-more").textContent = _("idea.discover");
  $("sow-full").hidden = foldable;
  $("sow-flip").hidden = leaves.length < 2;
  $("sow-prev").disabled = leaf === 0;
  $("sow-next").disabled = leaf === leaves.length - 1;
  $("sow-dots").innerHTML = leaves.map(
    (_, i) => `<i class="${i === leaf ? "on" : ""}"></i>`).join("");
  $("sow-card").animate
    ? $("sow-card").animate([{ opacity: 0, transform: "translateY(6px)" },
                             { opacity: 1, transform: "none" }],
                            { duration: 220, easing: "ease-out" })
    : null;
}

function flip(by) {
  const next = leaf + by;
  if (next < 0 || next >= leaves.length) return;
  leaf = next;
  paintLeaf();
}

$("sow-more").addEventListener("click", () => {
  const full = $("sow-full");
  const opening = full.hidden;
  full.hidden = false;
  $("sow-more").textContent = opening ? _("idea.less") : _("idea.discover");
  if (opening) {
    if (full.animate) {
      full.animate([{ opacity: 0, transform: "translateY(8px)" },
                    { opacity: 1, transform: "none" }],
                   { duration: 260, easing: "ease-out" });
    }
    // The thing just revealed is below the fold on a short window.
    full.scrollIntoView({ behavior: "smooth", block: "nearest" });
  } else {
    full.hidden = true;
  }
});

// Another one. One press, one idea, about a cent.
$("sow-die").addEventListener("click", async () => {
  // `if (job) return` was a silent refusal, and it only knew about runs this
  // window had started. The draw window has a line of its own for saying
  // what is happening — this is one of the things it is for.
  if (busy) {
    $("sow-run-stamp").textContent = _("home.already_running");
    return;
  }
  $("sow-die").classList.add("rolling");
  $("sow-die").disabled = true;
  $("dream").disabled = true;
  if (!await startJob("ideas", _("home.drawing"), "sow-log",
                      (why) => { $("sow-run-stamp").textContent = why; })) {
    $("sow-die").classList.remove("rolling");
    $("sow-die").disabled = false;
    $("dream").disabled = false;
  }
});

$("sow-prev").addEventListener("click", () => flip(-1));
$("sow-next").addEventListener("click", () => flip(1));
$("sow-close").addEventListener("click", closeSow);
$("sow").addEventListener("click", (e) => {
  if (e.target === $("sow")) closeSow();
});
document.addEventListener("keydown", (e) => {
  if (!$("ask").hidden) {
    if (e.key === "Escape") closeAsk();
    if (e.key === "Enter") $("ask-yes").click();
    return;
  }
  if ($("sow").hidden) return;
  if (e.key === "Escape") closeSow();
  if (e.key === "ArrowLeft") flip(-1);
  if (e.key === "ArrowRight") flip(1);
});

// Keyed on the page, not on its date. A day can hold two recaps — a first
// attempt that ran out of tokens and the real one — and keying on the date
// made the second tick *untick* the first: one row stayed lit while the set
// went back to empty, so the tray never appeared and nothing could be merged.
function toggle(card) {
  if (card.dataset.kind !== "week") return;   // a merge is not merged again
  const f = card.dataset.file;
  picked.has(f) ? picked.delete(f) : picked.add(f);
  card.classList.toggle("picked", picked.has(f));
  paintTray();
}

function paintTray() {
  const cards = document.querySelector(".cards");
  if (cards) cards.classList.toggle("choosing", picked.size > 0);
  $("tray").hidden = picked.size === 0;
  $("tray-n").textContent = picked.size === 1
    ? _("archive.one_chosen") : _("archive.n_chosen", { n: picked.size });
  $("tray-go").disabled = picked.size < 2;
}

$("tray-clear").addEventListener("click", () => {
  picked.clear();
  document.querySelectorAll(".card").forEach(
    (c) => c.classList.remove("picked"));
  paintTray();
});

// How long the drawing takes to finish. The request usually beats it, so the
// two are raced: the animation is never cut off half way, and never held on
// after it has finished playing.
const FUSE_MS = 1750;

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

$("tray-go").addEventListener("click", async () => {
  $("tray-go").disabled = true;
  const files = [...picked].sort();
  const weeks = files.map((f) => f.slice(0, 10));
  // Six chips fit across; more become a crowd that says nothing.
  const chips = weeks.length <= 6 ? weeks.map(sayDay)
    : [sayDay(weeks[0]), `+${weeks.length - 2}`, sayDay(weeks[weeks.length - 1])];
  $("fuse-chips").innerHTML = chips.map((c) => `<span>${esc(c)}</span>`).join("");
  $("fuse-say").textContent = _("archive.merging", { n: files.length });
  $("fuse").hidden = false;

  const [{ code, body }] = await Promise.all([
    // Pages, not dates: two recaps of one day are two different things.
    post("/api/merge", { files }),
    wait(FUSE_MS),
  ]);

  $("fuse").hidden = true;
  $("tray-go").disabled = false;
  if (code !== 200) {
    $("tray-n").textContent = body.error || _("archive.not_merged");
    return;
  }
  // The filter that let two weeks be ticked is «tutto» or «recap», and
  // «recap» hides merges: the page was made, opened, and then invisible on
  // the way back. Whatever was on, show the thing that was just made.
  if (only === "week") only = "all";
  await loadArchive();
  openRecap(body.file, "", _("archive.n_things", { n: body.things }),
            body.label);
});

// Asked in a dialog of winnow's own, never with `confirm()`. A native dialog
// is the one piece of this window that belongs to the browser: it looks like
// a web page from 2004, and in a webview it can be refused outright — which
// is what it was doing here. Nothing was ever deleted and nothing said so.
let asking = null;

function remove(card) {
  asking = card;
  $("ask-title").textContent = _("ask.title");
  $("ask-what").textContent = card.dataset.title
    || (card.dataset.kind === "week"
        ? _("ask.the_recap_of", { day: sayDay(card.dataset.week) })
        : card.dataset.label || _("ask.this_page"));
  $("ask-yes").disabled = false;
  $("ask").hidden = false;
  $("ask-no").focus();
}

function closeAsk() {
  $("ask").hidden = true;
  asking = null;
}

$("ask-no").addEventListener("click", closeAsk);
$("ask").addEventListener("click", (e) => {
  if (e.target === $("ask")) closeAsk();
});
$("ask-yes").addEventListener("click", async () => {
  if (!asking) return;
  $("ask-yes").disabled = true;
  const { code, body } = await api(
    "/api/recaps/" + encodeURIComponent(asking.dataset.file), "DELETE");
  if (code !== 200) {
    $("ask-what").textContent = body.error || _("ask.not_deleted");
    $("ask-yes").disabled = false;
    return;
  }
  closeAsk();
  loadArchive();
});

// Six dates read; twenty do not. Past that, the ends and the count.
function weekList(weeks) {
  const days = weeks.map(sayDay);
  if (days.length <= 6) return days.join(" · ");
  return `${days[0]} · ${days[1]} · ${days[2]} … ${days[days.length - 1]}` +
    " — " + _("archive.and_all", { days: days.length });
}

function openRecap(file, week, score, label) {
  $("page").src = "/recap/" + file;
  $("read-week").textContent = label || (week ? sayDay(week) : "");
  $("read-count").textContent = score || "";
  show("reader");
}

// «open» and «the post» inside a recap did nothing at all. They are ordinary
// `target="_blank"` links, which is right — the page is an artifact that gets
// mailed and has to work as a plain file — but a webview opens no popups and
// says nothing about it: the reader clicks and the window sits there.
//
// Handled here rather than in the page, so every recap ever written is fixed
// at once and none of them has to know it is being read inside an app. The
// frame is served by the engine, so it is same-origin and its document can be
// reached; the guard is there for the day it is not.
$("page").addEventListener("load", () => {
  let doc;
  try {
    doc = $("page").contentDocument;
  } catch (e) {
    return;                      // cross-origin: leave the page to itself
  }
  if (!doc) return;
  doc.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a) return;
    const href = a.href || "";
    if (!/^https?:/i.test(href)) return;   // an anchor inside the page
    e.preventDefault();
    api("/api/open", "POST", { url: href });
  });
});

$("back").addEventListener("click", () => {
  // Emptied on the way out: an iframe left loaded keeps a whole second page
  // in memory behind a screen nobody is looking at.
  $("page").src = "about:blank";
  show("archive");
  document.querySelectorAll(".tab").forEach(
    (t) => t.classList.toggle("on", t.dataset.go === "archive"));
});

// --- settings --------------------------------------------------------------
let models = null, config = null, draft = null;
let schedule = {}, profile = {}, keys = {};

const PENCIL = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M11.3 2.2a1.7 1.7 0 0 1 2.5 2.4L5.4 13 2 14l1-3.4z"/></svg>';

const eur = (n) => "€" + Number(n ?? 0).toFixed(2).replace(".", ",");

const esc = (t) => String(t ?? "").replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// --- the reading screen ----------------------------------------------------
async function loadSettings() {
  if (!models) models = (await api("/api/models")).body.models || [];
  const { code, body } = await api("/api/config");
  if (code !== 200) {
    $("settings-body").innerHTML =
      `<p class="empty">${_("settings.no_config")}</p>`;
    return;
  }
  config = body;

  const known = models.find((m) => m.model === body.model);
  const folders = (body.folders || []).map((f) =>
    `<span class="pill${f.active ? " on" : ""}">${esc(f.name)}</span>`).join("")
    || `<span class="pill">${_("settings.none")}</span>`;
  const on = (body.folders || []).filter((f) => f.active).length;

  const row = (key, value, which) =>
    `<div class="row"><span class="k">${key}</span>` +
    `<span class="v">${value}</span>` +
    (which ? `<button class="edit" data-edit="${which}" ` +
             `title="${esc(_("settings.edit", { what: key.toLowerCase() }))}" ` +
             `aria-label="${esc(_("settings.edit", { what: key.toLowerCase() }))}">` +
             `${PENCIL}</button>` : "") +
    "</div>";

  const [sched, prof, k] = await Promise.all([
    api("/api/schedule"), api("/api/profile"), api("/api/keys")]);
  schedule = sched.body; profile = prof.body; keys = k.body.keys || {};
  const when = sched.body.active
    ? _("settings.every_day_at", { time: sched.body.when })
    : _("settings.off");
  // Not `profile`: that name is taken by the module-level copy assigned two
  // lines up, and a `const` of the same name in this block shadows it — the
  // assignment then reads a variable declared later and throws.
  // The path, not the size. From outside the sheet the useful fact is
  // *which file* to open — a character count is bookkeeping, and it told a
  // reader nothing they could act on.
  const profileLabel = prof.body.exists
    ? (prof.body.short || prof.body.path || "")
    : _("settings.not_written");

  // A model whose key is missing is a run that dies at the first post, and
  // the row that changed it is the only place a reader can act on that.
  const modelValue = esc(known ? known.label : body.model) +
    (body.key_ready ? ""
     : ` <span class="pill bad">${_("settings.key_missing")}</span>`);

  $("settings-body").innerHTML = '<div class="rows">' +
    row(_("settings.model"), modelValue, "model") +
    row(_("settings.provider"), esc(brand(body.provider)) +
        (body.key_ready && CONSOLES[body.provider]
          ? ` <span class="pill on">${_("settings.key_set")}</span>` : ""),
        null) +
    row(_("settings.collection"), esc(when), "hour") +
    row(_("settings.how_many"),
        _("settings.each_run", { n: body.posts_per_run }), "posts") +
    row(_("settings.folders"), folders + (on ? "" :
        ` <span class="pill">${_("settings.none_on")}</span>`), "folders") +
    row(_("settings.spend_cap"),
        _("settings.a_week", { amount: eur(body.halt_eur_week) }), "spend") +
    row(_("settings.profile"), esc(profileLabel), "profile") +
    row(_("settings.theme"), themeLabel(), "theme") +
    row(_("settings.language"), esc(langLabel()), "lang") +
    "</div>";

  $("settings-body").querySelectorAll("[data-edit]").forEach((b) =>
    b.addEventListener("click", () => openSheet(b.dataset.edit)));
}

// --- the sheet -------------------------------------------------------------
function closeSheet() {
  // «Cancel» has to really cancel: a preview that survives it is a change
  // made behind a button that said it would not make one.
  if (lookBefore !== null) {
    applyLook(lookBefore);
    lookBefore = null;
  }
  if (langBefore !== null) {
    document.documentElement.setAttribute("lang", langBefore);
    applyLang();
    langBefore = null;
  }
  $("sheet").hidden = true;
  draft = null;
  $("saved").textContent = "";
  $("saved").className = "saved";
}

function say(text, bad) {
  const note = $("saved");
  note.className = "saved" + (bad ? " bad" : " ok");
  note.textContent = text;
}

// --- the ground and the accent ---------------------------------------------
// Two axes rather than a list of finished themes: three grounds times nine
// accents is twenty-seven looks that all work, out of twelve lines of CSS,
// and none of them is a combination nobody checked.
//
// Held in the browser, not in `config.toml`: it is nothing the collector or
// the judge ever reads, and putting it there would mean a scheduled run
// parsing a colour. `localStorage` can throw outright — a private window, a
// browser told to block site data — so every read and write is guarded and
// the page renders correctly having found nothing.
// The id is the colour's name in the stylesheet and in `look.json`; what a
// reader sees comes from the phrase table, like every other word here. Held
// as a literal, «Scuro» and «Viola» stayed Italian on an English window —
// the two rows a reader had just changed were the two that did not follow
// the language they had just chosen.
const GROUNDS = [
  { id: "chiaro", bg: "#e9eced", fg: "#10141a" },
  { id: "penombra", bg: "#2b3036", fg: "#eceff2" },
  { id: "scuro", bg: "#111417", fg: "#f0f3f6" },
];
const groundName = (id) => _("ground." + id);

const ACCENTS = [
  { id: "terracotta", hex: "#ce3a24" },
  { id: "rosso", hex: "#d2382f" },
  { id: "arancione", hex: "#e07b26" },
  { id: "giallo", hex: "#d9a412" },
  { id: "verde", hex: "#2f8f57" },
  { id: "blu", hex: "#2f6fd0" },
  { id: "viola", hex: "#8455c4" },
  { id: "rosa", hex: "#cf4d8e" },
  { id: "grafite", hex: "#6b7683" },
];
const accentName = (id) => _("accent." + id);

// The row on the settings screen: two words, because two things were chosen.
function themeLabel() {
  const look = readLook();
  const g = groundName(
    (GROUNDS.find((x) => x.id === look.ground) || GROUNDS[0]).id);
  const a = accentName(
    (ACCENTS.find((x) => x.id === look.accent) || ACCENTS[0]).id);
  return `${esc(g)} <span class="pill">${esc(a)}</span>`;
}

// The page arrives from the engine already wearing its colours — the two
// attributes are written into the served HTML — so this reads the document
// rather than a store. `localStorage` cannot be the answer here: the engine
// binds port 0, so every launch is a different origin and the browser hands
// back an empty store. It stays as the fallback for a page opened some other
// way, where there may be no engine behind it.
function readLook() {
  const root = document.documentElement;
  let ground = root.getAttribute("data-ground");
  let accent = root.getAttribute("data-accent");
  try {
    if (!ground) ground = localStorage.getItem("winnow.ground");
    if (!accent) accent = localStorage.getItem("winnow.accent");
  } catch (err) { /* site data off: the defaults are a whole look */ }
  return {
    ground: GROUNDS.some((x) => x.id === ground) ? ground : "chiaro",
    accent: ACCENTS.some((x) => x.id === accent) ? accent : "terracotta",
  };
}

function applyLook(look) {
  const root = document.documentElement;
  // The default carries no attribute on either axis: `:root` already is
  // chiaro/terracotta, and an attribute naming the default is a second place
  // the same thing can go wrong.
  // Both attributes are always written, defaults included: the server sets
  // them on every page it serves, and removing one here would leave the next
  // `readLook` falling through to a store that may say something else.
  const set = (attr, value, dflt) => root.setAttribute(attr, value || dflt);
  set("data-ground", look.ground, "chiaro");
  set("data-accent", look.accent, "terracotta");
  try {
    localStorage.setItem("winnow.ground", look.ground || "chiaro");
    localStorage.setItem("winnow.accent", look.accent || "terracotta");
  } catch (err) { /* it still looks right for as long as the window is open */ }
  // Written through on the press, not on save: the sheet applies as you
  // choose, and a window closed without pressing Salva must still come back
  // wearing what is on screen. `closeSheet` reverts by applying the old look,
  // which writes through in the same way.
  fetch("/api/look", {
    method: "PATCH", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ground: look.ground, accent: look.accent }),
  }).catch(() => { /* no engine behind this page: the browser remembers */ });
}

applyLook(readLook());
applyLang();

// Titles and leads are *functions*, not strings: this object is built once at
// load and the language can change while the app is open — captured as values
// they would be the ones the window opened in.
const SHEETS = {
  model: {
    title: () => _("sheet.model.title"),
    lead: () => _("sheet.model.lead"),
    draw: drawModel,
    patch: () => ({ provider: draft.provider, model: draft.model,
                    base_url: draft.base_url || null }),
  },
  posts: {
    title: () => _("sheet.posts.title"),
    lead: () => _("sheet.posts.lead"),
    draw: drawPosts,
    patch: () => ({ posts_per_run: Number(draft.posts_per_run) }),
  },
  hour: {
    title: () => _("sheet.hour.title"),
    lead: () => _("sheet.hour.lead"),
    draw: drawHour,
    patch: null,          // it installs a system job, not a line of config
  },
  spend: {
    title: () => _("sheet.spend.title"),
    lead: () => _("sheet.spend.lead"),
    draw: drawSpend,
    patch: () => ({ warn_eur_week: Number(draft.warn_eur_week),
                    halt_eur_week: Number(draft.halt_eur_week) }),
  },
  lang: {
    title: () => _("sheet.lang.title"),
    lead: () => _("sheet.lang.lead"),
    draw: drawLang,
    patch: null,          // a preference of this installation, not config
  },
  theme: {
    title: () => _("sheet.theme.title"),
    lead: () => _("sheet.theme.lead"),
    draw: drawTheme,
    patch: null,          // it is a preference of this browser, not config
  },
  profile: {
    title: () => _("sheet.profile.title"),
    lead: () => _("sheet.profile.lead"),
    draw: drawProfile,
    patch: null,
  },
  folders: {
    title: () => _("sheet.folders.title"),
    lead: () => _("sheet.folders.lead"),
    draw: drawFolders,
    patch: () => ({ folders: draft.folders }),
  },
};

function openSheet(which) {
  const sheet = SHEETS[which];
  // A copy, never the live config: cancelling has to leave nothing behind,
  // and editing the object the reading screen draws from would change that
  // screen before anything was saved.
  draft = JSON.parse(JSON.stringify({
    provider: config.provider, model: config.model,
    base_url: config.base_url, posts_per_run: config.posts_per_run,
    warn_eur_week: config.warn_eur_week, halt_eur_week: config.halt_eur_week,
    folders: (config.folders || []).map((f) => ({ ...f })),
    schedule: schedule, profile: profile,
  }));
  // Enabled here, not by whoever disabled it. The save handler switches it
  // off while it works and every branch was supposed to switch it back on —
  // the two that return early (the theme and the profile, neither of which
  // writes to config.toml) did not, so the button stayed dead for the rest of
  // the session and a second change was impossible. A sheet that opens has a
  // working save button, whatever the last one did.
  $("sheet-save").disabled = false;
  // Looked up now, not when SHEETS was built: the language can change while
  // the app is open, and a title captured at load would be the old one.
  $("sheet-title").textContent =
    typeof sheet.title === "function" ? sheet.title() : sheet.title;
  $("sheet-lead").textContent =
    typeof sheet.lead === "function" ? sheet.lead() : sheet.lead;
  if (which === "lang") langBefore = lang();
  $("sheet").hidden = false;
  $("sheet-save").dataset.which = which;
  sheet.draw();
}

// Where a key is made. Named here rather than looked up in the engine
// because it is a URL a person opens in a browser, not something winnow
// calls.
const CONSOLES = {
  anthropic: "https://console.anthropic.com/settings/keys",
  openai: "https://platform.openai.com/api-keys",
};

// A company writes its own name. `provider` is a config value, not a label.
const BRAND = { anthropic: "Anthropic", openai: "OpenAI" };
const brand = (p) => BRAND[p] || p;

// The key state is redrawn on its own, so choosing a provider can answer
// "and does it have a key?" without rebuilding the list under the cursor.
function drawKey() {
  const box = $("key");
  if (!box) return;
  const provider = draft.provider;
  if (!CONSOLES[provider]) {          // a local model has no account, no bill
    box.innerHTML = "";
    return;
  }
  if (keys[provider] && !draft.replacing) {
    // No empty field when the key is already there. A box saying "incollala
    // qui" is an instruction, and it read as one — somebody with a working
    // setup went looking for their key to type it again. Nothing to fill in
    // means nothing to do, which is the true answer.
    box.innerHTML = '<p class="done"><span class="ok"></span>' +
      esc(_("sheet.key.set", { brand: brand(provider) })) + "</p>" +
      `<button class="ghost" id="key-replace">${_("sheet.key.replace")}</button>`;
    $("key-replace").addEventListener("click", () => {
      draft.replacing = true;
      drawKey();
      $("key-input").focus();
    });
    return;
  }

  box.innerHTML = '<span class="hint">' + (keys[provider]
    ? _("sheet.key.replacing")
    : _("sheet.key.needed", { brand: esc(brand(provider)) })) +
    "</span>" + keyField(provider);

  const field = $("key-input");
  field.addEventListener("input", () => { draft.key = field.value.trim(); });
  $("key-open").addEventListener("click",
    () => api("/api/console?p=" + encodeURIComponent(provider), "POST"));
}

function keyField(provider) {
  return '<label class="field"><span>' +
    esc(_("sheet.model.key_of", { brand: brand(provider) })) + "</span>" +
    '<input type="password" id="key-input" autocomplete="off" ' +
    `placeholder="${esc(_("sheet.model.paste"))}"></label>` +
    '<div class="acts" style="border:0;padding:0;margin-top:.9rem">' +
      `<button class="ghost edged" id="key-open">${_("sheet.model.open_keys")}` +
      `</button><span class="hint" style="margin:0">` +
      `${_("sheet.model.key_hint")}</span></div>`;
}

function drawModel() {
  const known = models.some((m) => m.model === draft.model && m.model);
  const rows = models.filter((m) => m.model).map((m) =>
    `<button class="opt${m.model === draft.model ? " on" : ""}" ` +
    `data-model="${esc(m.model)}" data-provider="${esc(m.provider)}">` +
    `<span class="tick"></span><span class="txt"><b>${esc(m.label)}</b>` +
    `<span>${esc(m.hint_it || m.hint)}</span></span></button>`);
  rows.push(
    `<button class="opt${known ? "" : " on"}" data-model="" data-provider="">` +
    '<span class="tick"></span><span class="txt"><b>Un altro modello</b>' +
    "<span>il tuo, sulla tua macchina, o un nome che scrivi a mano</span>" +
    "</span></button>");

  $("sheet-body").innerHTML = `<div class="opts">${rows.join("")}</div>` +
    `<div id="custom"${known ? " hidden" : ""}>` +
      `<label class="field"><span>${_("sheet.model.name")}</span>` +
      `<input type="text" id="m-name" value="${esc(known ? "" : draft.model)}" ` +
      'placeholder="qwen2.5vl"></label>' +
      `<label class="field"><span>${_("sheet.model.address")}</span>` +
      `<input type="text" id="m-url" value="${esc(draft.base_url || "")}" ` +
      'placeholder="http://localhost:11434/v1"></label>' +
      `<span class="hint">${_("sheet.model.local_hint")}</span>` +
    "</div>" +
    '<div id="key"></div>';

  drawKey();
  $("sheet-body").querySelectorAll(".opt").forEach((b) =>
    b.addEventListener("click", () => {
      $("sheet-body").querySelectorAll(".opt").forEach(
        (x) => x.classList.remove("on"));
      b.classList.add("on");
      const custom = !b.dataset.model;
      $("custom").hidden = !custom;
      if (custom) {
        draft.provider = "local";
        draft.model = $("m-name").value.trim();
        draft.base_url = $("m-url").value.trim();
      } else {
        draft.provider = b.dataset.provider;
        draft.model = b.dataset.model;
        draft.base_url = null;
      }
      draft.key = "";
      draft.replacing = false;
      drawKey();
    }));
  const sync = () => {
    draft.provider = "local";
    draft.model = $("m-name").value.trim();
    draft.base_url = $("m-url").value.trim();
  };
  $("m-name").addEventListener("input", sync);
  $("m-url").addEventListener("input", sync);
}

// What was on when the sheet opened, so «Annulla» really cancels. A colour
// judged by looking at it has to be applied on the press — but a preview that
// survives a cancel is not a preview, it is a change made behind a button
// that said it would not make one.
// What the language row says. The name of a language is written in that
// language — «Italiano», not «Italian» — because it is read by somebody
// looking for their own.
function langLabel() {
  return (LANGS.find((l) => l.id === lang()) || LANGS[0]).name;
}

function drawLang() {
  const now = lang();
  $("sheet-body").innerHTML = '<div class="grounds langs">' + LANGS.map((l) =>
    `<button class="ground${l.id === now ? " on" : ""}" ` +
    `data-lang-id="${l.id}"><b>${esc(l.name)}</b>` +
    `<span>${esc(l.why)}</span></button>`).join("") + "</div>";
  $("sheet-body").querySelectorAll("[data-lang-id]").forEach((b) =>
    b.addEventListener("click", () => {
      // Applied on the press, like the theme: a language is judged by seeing
      // the window in it, and the sheet itself is part of the window.
      document.documentElement.setAttribute("lang", b.dataset.langId);
      applyLang();
      const sheet = SHEETS.lang;
      $("sheet-title").textContent = _("sheet.lang.title");
      $("sheet-lead").textContent = _("sheet.lang.lead");
      drawLang();
    }));
}

let lookBefore = null, langBefore = null;

function drawTheme() {
  const now = readLook();
  lookBefore = now;
  $("sheet-body").innerHTML =
    `<p class="hint">${_("sheet.theme.ground")}</p><div class="grounds">` +
    GROUNDS.map((g) =>
      `<button class="ground${g.id === now.ground ? " on" : ""}" ` +
      `data-ground-id="${g.id}">` +
      `<span class="prev" style="background:${g.bg}; color:${g.fg}">Aa</span>` +
      `<b>${esc(groundName(g.id))}</b>` +
      `<span>${esc(_("ground." + g.id + ".why"))}</span></button>`).join("") +
    `</div><p class="hint">${_("sheet.theme.accent")}</p>` +
    '<div class="swatches">' + ACCENTS.map((a) =>
      `<button class="swatch${a.id === now.accent ? " on" : ""}" ` +
      `data-accent-id="${a.id}" style="--c:${a.hex}" ` +
      `title="${esc(accentName(a.id))}" ` +
      `aria-label="${esc(accentName(a.id))}"></button>`).join("") +
    '</div><p class="hint" id="accent-name"></p>';

  const paint = (look) => {
    // Applied on the press, never on save: a colour is judged by looking at
    // it, and a preview you have to confirm is a preview nobody trusts.
    applyLook(look);
    $("sheet-body").querySelectorAll(".ground").forEach(
      (b) => b.classList.toggle("on", b.dataset.groundId === look.ground));
    $("sheet-body").querySelectorAll(".swatch").forEach(
      (b) => b.classList.toggle("on", b.dataset.accentId === look.accent));
    // Apple names the colour under the row rather than beside every dot,
    // and it is right: nine labels is a list, one label is an answer.
    const picked = ACCENTS.find((a) => a.id === look.accent);
    $("accent-name").textContent = picked ? accentName(picked.id) : "";
  };
  paint(now);

  $("sheet-body").querySelectorAll("[data-ground-id]").forEach((b) =>
    b.addEventListener("click", () =>
      paint({ ...readLook(), ground: b.dataset.groundId })));
  $("sheet-body").querySelectorAll("[data-accent-id]").forEach((b) =>
    b.addEventListener("click", () =>
      paint({ ...readLook(), accent: b.dataset.accentId })));
}

function drawPosts() {
  $("sheet-body").innerHTML =
    '<label class="field"><span>Post a ogni raccolta</span>' +
    `<input type="number" id="ppr" min="1" max="200" value="${draft.posts_per_run}">` +
    '</label><span class="hint" id="ppr-note"></span>';
  const note = () => {
    const n = Math.max(1, Number(draft.posts_per_run) || 0);
    // Said in money and in days, because that is what the number decides.
    // ~$0.005 a post is what a year of runs has actually cost.
    $("ppr-note").textContent =
      _("sheet.posts.note", { n, money: eur(n * 0.005 * 7 * 0.92) });
  };
  note();
  $("ppr").addEventListener("input", (e) => {
    draft.posts_per_run = e.target.value;
    note();
  });
}

const HOURS = ["07:00", "09:00", "13:00", "19:00", "22:00"];

function drawHour() {
  const now = draft.schedule || {};
  const rows = HOURS.map((h) =>
    `<button class="opt${now.active && now.when === h ? " on" : ""}" ` +
    `data-hour="${h}"><span class="tick"></span><span class="txt">` +
    `<b>${h}</b></span></button>`);
  const custom = now.active && !HOURS.includes(now.when);
  rows.push(`<button class="opt${custom ? " on" : ""}" data-hour="">` +
    `<span class="tick"></span><span class="txt">` +
    `<b>${_("sheet.hour.other")}</b></span></button>`);
  rows.push(`<button class="opt${now.active ? "" : " on"}" data-hour="off">` +
    `<span class="tick"></span><span class="txt">` +
    `<b>${_("sheet.hour.never")}</b>` +
    `<span>${_("sheet.hour.manual")}</span></span></button>`);

  $("sheet-body").innerHTML = `<div class="opts">${rows.join("")}</div>` +
    `<div id="at"${custom ? "" : " hidden"}><label class="field">` +
    `<span>${_("sheet.hour.at")}</span>` +
    `<input type="text" id="hh" value="${esc(now.when || "")}" ` +
    'placeholder="13:00"></label></div>';
  // Which scheduler installed it — launchd, systemd, cron — is winnow's own
  // plumbing. A reader picking an hour cannot act on it, and a name they do
  // not recognise reads as a warning about something they broke.

  $("sheet-body").querySelectorAll("[data-hour]").forEach((b) =>
    b.addEventListener("click", () => {
      $("sheet-body").querySelectorAll(".opt").forEach(
        (x) => x.classList.remove("on"));
      b.classList.add("on");
      const v = b.dataset.hour;
      $("at").hidden = v !== "";
      draft.at = v === "" ? $("hh").value : v;
    }));
  $("hh").addEventListener("input", (e) => { draft.at = e.target.value; });
}

function drawSpend() {
  $("sheet-body").innerHTML =
    '<label class="field"><span>Avvisa oltre</span>' +
    `<input type="text" id="warn" value="${draft.warn_eur_week}"></label>` +
    `<label class="field"><span>${_("sheet.spend.stop")}</span>` +
    `<input type="text" id="halt" value="${draft.halt_eur_week}"></label>` +
    `<span class="hint">${_("sheet.spend.hint")}</span>`;
  $("warn").addEventListener("input",
    (e) => { draft.warn_eur_week = e.target.value.replace(",", "."); });
  $("halt").addEventListener("input",
    (e) => { draft.halt_eur_week = e.target.value.replace(",", "."); });
}

function drawProfile() {
  const p = draft.profile || {};
  $("sheet-body").innerHTML =
    '<div class="rows" style="margin:0">' +
    `<div class="row"><span class="k">${_("sheet.profile.state")}</span>` +
    `<span class="v">${
      p.exists ? _("settings.chars", { n: p.chars.toLocaleString(lang()) })
               : _("settings.not_written")}</span></div>` +
    `<div class="row"><span class="k">File</span><span class="v">${
      esc(p.short || p.path || "")}</span></div></div>` +
    '<div class="acts" style="border:0;padding:0;margin-top:1.2rem">' +
      `<button class="ghost edged" id="openprof">${_("sheet.profile.open")}` +
      "</button>" +
      '<span class="hint" id="prof-note" style="margin:0">' +
      `${_("sheet.profile.hint")}</span></div>`;
  $("openprof").addEventListener("click", async () => {
    await api("/api/profile/open", "POST");
    $("prof-note").textContent = _("sheet.profile.opened");
  });
}

function drawFolders() {
  // The whole row is the switch again: there is nothing else on it to hit.
  const rows = draft.folders.map((f, i) =>
    `<button class="opt${f.active ? " on" : ""}" data-i="${i}" ` +
    `aria-pressed="${f.active}">` +
    // The name and the state, and nothing else. "winnow la legge" under the
    // name said exactly what "accesa" says on the right; two labels for one
    // fact make a reader look for the difference between them.
    `<span class="tick"></span><span class="txt"><b>${esc(f.name)}</b></span>` +
    `<span class="state">${_(f.active ? "sheet.folders.on"
                                           : "settings.off")}</span>` +
    "</button>").join("");

  $("sheet-body").innerHTML = `<div class="opts">${rows ||
    `<div class="opt"><span class="txt"><b>${_("sheet.folders.none")}</b>` +
    `<span>${_("sheet.folders.look")}</span></span></div>`}</div>` +
    '<div class="acts" style="border:0;padding:0;margin-top:1.1rem">' +
      `<button class="ghost edged" id="scan">` +
      `${_("sheet.folders.rescan_btn")}</button>` +
      `<span class="hint" id="scan-note" style="margin:0">` +
      `${_("sheet.folders.rescan")}</span>` +
    "</div>";

  wireFolders();
  $("scan").addEventListener("click", scanFolders);
}

function wireFolders() {
  $("sheet-body").querySelectorAll("[data-i]").forEach((b) =>
    b.addEventListener("click", () => {
      const f = draft.folders[Number(b.dataset.i)];
      f.active = !f.active;
      b.setAttribute("aria-pressed", f.active);
      b.classList.toggle("on", f.active);
      b.querySelector(".state").textContent =
        _(f.active ? "sheet.folders.on" : "settings.off");
    }));
}

async function scanFolders() {
  const note = $("scan-note"), button = $("scan");
  button.disabled = true;
  note.textContent = "Sto aprendo Instagram…";
  const { code, body } = await api("/api/folders/scan", "POST");
  if (code !== 202) {
    button.disabled = false;
    note.textContent = body.error || _("archive.not_merged");
    return;
  }
  // Polled like any other run: it drives a real browser and can take a while.
  const tick = setInterval(async () => {
    const { body: j } = await api("/api/jobs/" + body.id);
    if (!j.done) return;
    clearInterval(tick);
    button.disabled = false;
    if (j.error || !j.result) {
      note.textContent = j.error || _("archive.not_merged");
      return;
    }
    const have = new Set(draft.folders.map((f) => f.name));
    const added = j.result.folders.filter((f) => !have.has(f.name));
    // Found ones arrive off. Switching somebody's folders on because a scan
    // happened to see them is deciding for them.
    added.forEach((f) => draft.folders.push(
      { name: f.name, url: f.url, active: false }));
    drawFolders();
    $("scan-note").textContent = added.length
      ? _("sheet.folders.found", { n: added.length })
      : _("sheet.folders.none_new");
  }, 900);
}

$("sheet-cancel").addEventListener("click", closeSheet);
// A click on the scrim is a cancel; one inside the panel is not.
$("sheet").addEventListener("click", (e) => {
  if (e.target === $("sheet")) closeSheet();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("sheet").hidden) closeSheet();
});

$("sheet-save").addEventListener("click", async (e) => {
  // Held in a variable, not read off the event afterwards: `currentTarget` is
  // only set while the event is being dispatched, so the first line after the
  // await found null and the save died silently — the sheet simply never
  // closed, with nothing on screen to say why.
  const button = e.currentTarget;
  const which = button.dataset.which;
  button.disabled = true;

  // Not everything on this screen is a line of config.toml. The hour installs
  // a system job; the profile is a file somebody edits themselves. Sending
  // those to /api/config would be a 400 about a key that does not exist.
  // Neither of these is a line of config.toml: the profile is a file
  // somebody edits themselves, and the theme is already applied and already
  // remembered by the browser.
  if (which === "profile") { closeSheet(); return; }
  if (which === "theme") {
    lookBefore = null;                  // keep what is on screen
    closeSheet();
    loadSettings();
    return;
  }
  if (which === "lang") {
    langBefore = null;
    await fetch("/api/look", {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lang: lang() }),
    }).catch(() => { /* no engine: it holds until the window closes */ });
    closeSheet();
    // Everything already drawn was drawn in the old language.
    applyLang();
    loadSettings();
    loadArchive();
    refresh();
    return;
  }
  // The key goes first and on its own route: a provider written without one
  // is a configuration that looks saved and dies at the next run — which is
  // the whole reason this exists. If it fails, nothing else is written.
  if (which === "model" && draft.key) {
    const r = await fetch("/api/keys", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ provider: draft.provider, key: draft.key }),
    });
    const kb = await r.json().catch(() => ({}));
    if (r.status !== 200) {
      button.disabled = false;
      say(kb.error || _("settings.key_not_saved"), true);
      return;
    }
    keys = kb.keys || keys;
    draft.key = "";
  }

  const to = which === "hour" ? "/api/schedule" : "/api/config";
  const payload = which === "hour"
    ? (draft.at === "off" ? { off: true } : { at: draft.at || "" })
    : SHEETS[which].patch();

  const r = await fetch(to, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const body = await r.json().catch(() => ({}));
  button.disabled = false;
  if (r.status === 200) {
    closeSheet();
    loadSettings();
    return;
  }
  button.disabled = false;
  // The engine's own sentence, shown where the change was made. The sheet
  // stays open with what was typed still in it: closing it would throw the
  // work away at the exact moment the reader has to correct it.
  say(body.error || _("settings.not_saved"), true);
});

// --- tabs ------------------------------------------------------------------
const SCREENS = ["home", "archive", "settings", "reader"];

function show(which) {
  SCREENS.forEach((s) => ($(s).hidden = s !== which));
}

document.querySelectorAll(".tab").forEach((t) =>
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
    t.classList.add("on");
    show(t.dataset.go);
    if (t.dataset.go === "archive") loadArchive();
    if (t.dataset.go === "settings") loadSettings();
  }));

refresh();
setInterval(() => { if (!job) refresh(); }, 4000);
</script>
</body>
</html>
