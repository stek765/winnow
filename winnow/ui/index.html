<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>winnow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* The same light table as the recap page: the app and the page it produces
   have to read as one product, not two that happen to ship together. */
:root{
  --glass:#e9eced; --lit:#fbfcfc; --ink:#10141a; --soft:#4d565f;
  --faint:#8b949c; --rule:#d7dcde; --grease:#ce3a24; --amber:#a8710f;
  --good:#2f7d5b;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:clamp(1.5rem,5vw,3.5rem);
  --lift:0 1px 2px rgba(16,20,26,.14), 0 14px 34px -22px rgba(16,20,26,.5);
}
*{box-sizing:border-box;}
html,body{height:100%;}

/* --- the veil ----------------------------------------------------------
   A window that is mostly empty space needs the empty space to be part of
   the design rather than the absence of one. This layer is everything
   behind the type: the painting the tool is named after, two slow warm
   lights, and a few grains of chaff crossing the room.

   Everything here is quiet on purpose — one earlier attempt at atmosphere
   was rejected as "too much", and the lesson held: the headline has to win
   over the background at every moment, so nothing below goes past 0.14
   opacity or moves fast enough to catch the eye while reading.

   Fixed and pointer-events:none, so it never scrolls with a screen and
   never eats a click meant for the page. */
.veil{position:fixed; inset:0; z-index:0; overflow:hidden;
  pointer-events:none;}
.app{position:relative; z-index:1;}

/* Millet's winnower, veiled: masked to nothing at every edge so it reads as
   light on the wall and not as a photograph pasted on the page. */
.art{
  position:absolute; inset:-6%;
  /* Sized by its own height, never `cover`. The painting is a tall portrait
     and the window is a wide landscape: `cover` blew it up until the
     winnower himself was off-frame and all that was left on the page was a
     pale smudge — atmosphere with nothing in it. At `auto 112%` the whole
     figure is in the room, which is the only reason to use this picture
     rather than any other texture. */
  background:url("/winnower.jpg") no-repeat 88% 46%/auto 112%;
  opacity:.2; filter:saturate(.7) contrast(1.04);
  -webkit-mask-image:radial-gradient(50% 78% at 82% 50%, #000 0%,
    rgba(0,0,0,.62) 46%, transparent 78%);
  mask-image:radial-gradient(50% 78% at 82% 50%, #000 0%,
    rgba(0,0,0,.62) 46%, transparent 78%);
  animation:breathe 68s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:scale(1.03) translate3d(0,0,0);}
  50%{transform:scale(1.09) translate3d(-1.1%,-.9%,0);}
}

/* Two lights, not a gradient sweep: a sweep announces itself, two slow
   pools of warmth just make the room feel lit from somewhere. */
.glow{position:absolute; border-radius:50%; filter:blur(70px);}
.g1{width:52vw; height:52vw; left:-12vw; top:-18vw;
  background:radial-gradient(circle, rgba(255,255,255,.9), transparent 68%);
  animation:drift1 34s ease-in-out infinite;}
.g2{width:42vw; height:42vw; right:2vw; bottom:-16vw;
  background:radial-gradient(circle, rgba(206,58,36,.10), transparent 66%);
  animation:drift2 46s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0);}
  50%{transform:translate3d(4%,3%,0);}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0);}
  50%{transform:translate3d(-5%,-4%,0);}}

/* The chaff. This is the one thing on the screen that says what the word
   winnow means, so it is the only moving part allowed to be noticed —
   and even then it crosses the window in half a minute. */
.chaff span{position:absolute; display:block; width:5px; height:8px;
  border-radius:50%; background:var(--grease); opacity:0;
  animation:blow linear infinite;}
@keyframes blow{
  0%{opacity:0; transform:translate3d(0,0,0) rotate(0deg);}
  12%{opacity:.34;}
  78%{opacity:.24;}
  100%{opacity:0; transform:translate3d(46vw,-30vh,0) rotate(190deg);}
}
body{
  margin:0; color:var(--ink); font-family:var(--body); font-size:16px;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  background:radial-gradient(120% 80% at 50% -20%, #fff 0%, rgba(255,255,255,0) 62%), var(--glass);
}
button{font:inherit; cursor:pointer; border:0; background:none; color:inherit;}
a{color:inherit;}

/* --- chrome ------------------------------------------------------------ */
.app{display:flex; flex-direction:column; height:100%;}
.bar{
  display:flex; align-items:center; gap:.6rem; flex:none;
  padding:1rem var(--pad) .9rem; -webkit-app-region:drag;
}
.mark{color:var(--grease); flex:none; transform:translateY(2px);}
.mark .grain{fill:var(--grease); animation:drift 5s ease-in-out infinite;
  animation-delay:calc(var(--i) * .4s);}
@keyframes drift{0%,100%{transform:translate(0,0);} 50%{transform:translate(2px,-1.6px);}}
.name{font-family:var(--display); font-weight:700; font-size:1.15rem;
  letter-spacing:-.02em;}
.tabs{margin-left:auto; display:flex; gap:.25rem; -webkit-app-region:no-drag;}
.tab{font-family:var(--mono); font-size:.66rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint); padding:.45rem .8rem;
  border-radius:999px; transition:background .18s, color .18s;}
.tab:hover{color:var(--ink);}
.tab.on{background:var(--ink); color:var(--lit);}

/* In the native window the close/minimise/zoom buttons are drawn *over* the
   page, top left — there is no system title bar to hold them. So the bar gets
   a band above it that belongs to them alone.

   Padding on the left would have been shorter, and wrong: it would push the
   wheat ear out of line with the headline underneath it, and a logo that does
   not share the page's left edge reads as a mistake from across the room. */
.native .bar{padding-top:2.6rem;}

.screen{flex:1; overflow-y:auto; padding:0 var(--pad) var(--pad);}
.screen[hidden]{display:none;}

/* --- home -------------------------------------------------------------- */
.home{display:flex; flex-direction:column; justify-content:center;
  min-height:100%; max-width:44rem;}
.dot{display:inline-flex; align-items:center; gap:.5rem;
  font-family:var(--mono); font-size:.66rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint); margin-bottom:1.1rem;}
.dot::before{content:""; width:8px; height:8px; border-radius:50%;
  background:var(--faint);}
.s-ready .dot::before{background:var(--good);}
.s-busy .dot::before{background:var(--amber); animation:pulse 1.4s ease-in-out infinite;}
.s-brake .dot::before,.s-logged_out .dot::before{background:var(--grease);}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.25;}}

h1{font-family:var(--display); font-weight:700;
  font-size:clamp(1.8rem,4.4vw,2.9rem); line-height:1.06;
  letter-spacing:-.03em; margin:0 0 .6rem; max-width:18ch;}
.detail{color:var(--soft); margin:0 0 clamp(1.6rem,4vw,2.3rem); max-width:46ch;}
.go{
  display:inline-flex; align-items:center; gap:.7rem; align-self:flex-start;
  background:var(--grease); color:#fff; font-family:var(--mono);
  font-size:.76rem; letter-spacing:.12em; text-transform:uppercase;
  padding:1rem 1.6rem; border-radius:999px;
  box-shadow:0 2px 6px rgba(206,58,36,.22), 0 12px 26px -14px rgba(206,58,36,.6);
  transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s, background .16s;
}
.go:hover{transform:translateY(-1px); background:#b8331f;}
.go:active{transform:translateY(0);}
.go[disabled]{background:var(--faint); box-shadow:none; cursor:default;
  transform:none;}
.go .arrow{transition:transform .16s;}
.go:hover .arrow{transform:translateX(3px);}

.stats{display:flex; flex-wrap:wrap; align-items:baseline; gap:1.6rem;
  margin-top:clamp(2rem,5vw,3rem); padding-top:1.3rem;
  border-top:1px solid var(--rule);}
.stat{display:flex; align-items:baseline; gap:.4rem;
  font-family:var(--mono); font-size:.68rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--faint);}
.stat b{font-family:var(--display); font-size:1.15rem; font-weight:600;
  letter-spacing:-.02em; color:var(--ink);}
.warn{color:var(--amber);}

/* What the app is for, said once and quietly. It sits under the numbers
   rather than over the headline: a reader who already knows should be able
   to ignore it every day without it ever being in the way, and a reader who
   does not should find it without asking. */
.purpose{margin:1.6rem 0 0; max-width:42ch; font-size:.86rem; line-height:1.5;
  color:var(--faint);}
.purpose b{font-weight:600; color:var(--soft);}

/* --- the live log ------------------------------------------------------ */
.log{margin-top:1.4rem; border-left:2px solid var(--rule);
  padding-left:1rem; max-height:14rem; overflow-y:auto;}
.log p{margin:0 0 .4rem; font-family:var(--mono); font-size:.76rem;
  color:var(--soft); animation:in .3s ease both;}
.log p:last-child{color:var(--ink);}
@keyframes in{from{opacity:0; transform:translateX(-5px);} to{opacity:1; transform:none;}}
.log .bad{color:var(--grease);}

/* --- archive ----------------------------------------------------------- */
.eyebrow{font-family:var(--mono); font-size:.66rem; letter-spacing:.2em;
  text-transform:uppercase; color:var(--faint); margin:1.5rem 0 1rem;}
.cards{display:grid; gap:1px; background:var(--rule);
  border:1px solid var(--rule); border-radius:3px; overflow:hidden;
  max-width:44rem;}
.card{display:flex; align-items:center; gap:1rem; width:100%; text-align:left;
  background:var(--lit); padding:1rem 1.2rem; transition:background .16s;}
.card:hover{background:#fff;}
.card b{font-family:var(--display); font-size:1.05rem; font-weight:600;
  letter-spacing:-.01em;}
.card span{font-family:var(--mono); font-size:.7rem; color:var(--faint);
  margin-left:auto;}
.empty{color:var(--soft); max-width:40ch;}

/* --- settings ---------------------------------------------------------- */
.rows{max-width:44rem;}
.row{display:flex; align-items:baseline; gap:1rem; padding:.85rem 0;
  border-bottom:1px solid var(--rule);}
.row .k{font-family:var(--mono); font-size:.7rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--faint); width:9rem; flex:none;}
.row .v{font-family:var(--mono); font-size:.82rem; word-break:break-word;}
.pill{display:inline-block; font-family:var(--mono); font-size:.68rem;
  padding:.24rem .55rem; border-radius:999px; margin:0 .3rem .3rem 0;
  border:1px solid var(--rule); color:var(--faint);}
.pill.on{border-color:var(--good); color:var(--good);}

/* The controls do not live on this screen: the reading version of it was the
   one people liked, and a page that is half report and half form is neither.
   So each row keeps its calm and carries one way in. */
.row{position:relative;}
.edit{display:inline-flex; align-items:center; justify-content:center;
  width:30px; height:30px; margin-left:auto; flex:none; border-radius:50%;
  border:1px solid var(--rule); color:var(--faint); background:var(--lit);
  transition:border-color .15s, color .15s, transform .15s;}
.edit:hover{border-color:var(--grease); color:var(--grease);
  transform:rotate(-8deg);}
.edit svg{width:14px; height:14px;}

/* --- the sheet ----------------------------------------------------------
   One setting at a time, on a surface of its own. Editing in place would
   mean the page shows both what is saved and what is being typed, and no
   way to tell which is which. */
.sheet{position:fixed; inset:0; z-index:20; display:flex;
  align-items:flex-end; justify-content:center;
  background:rgba(16,20,26,.24); backdrop-filter:blur(3px);
  animation:fade .18s ease both;}
.sheet[hidden]{display:none;}
@keyframes fade{from{opacity:0;} to{opacity:1;}}
.panel{width:min(46rem,100%); max-height:88vh; overflow-y:auto;
  background:var(--lit); border-radius:14px 14px 0 0;
  border:1px solid var(--rule); border-bottom:0;
  padding:clamp(1.5rem,4vw,2.4rem);
  box-shadow:0 -8px 60px -20px rgba(16,20,26,.55);
  animation:rise .26s cubic-bezier(.2,.8,.3,1) both;}
@keyframes rise{from{transform:translateY(22px);} to{transform:none;}}
.panel h2{font-family:var(--display); font-weight:700; letter-spacing:-.025em;
  font-size:1.5rem; margin:0 0 .35rem;}
.panel .lead{margin:0 0 1.5rem; color:var(--soft); font-size:.9rem;
  max-width:52ch; line-height:1.45;}

/* A choice is a whole row you can hit, not a dot you have to aim at. */
.opts{display:grid; gap:1px; background:var(--rule); border:1px solid var(--rule);
  border-radius:4px; overflow:hidden;}
.opt{display:flex; align-items:flex-start; gap:.8rem; width:100%;
  text-align:left; background:#fff; padding:.85rem 1rem;
  transition:background .15s;}
.opt:hover{background:var(--glass);}
.opt.on{background:#fff; box-shadow:inset 3px 0 0 var(--grease);}
.opt .tick{width:15px; height:15px; margin-top:.2rem; flex:none;
  border:1px solid var(--rule); border-radius:50%; transition:.15s;}
.opt.on .tick{border-color:var(--grease); border-width:5px;}
.opt .txt b{display:block; font-family:var(--display); font-weight:600;
  font-size:.98rem; letter-spacing:-.01em;}
.opt .txt span{display:block; font-size:.8rem; color:var(--faint);
  margin-top:.1rem;}
/* The folder row: a switch on the left, a sentence on the right. */
.opt .pick{display:flex; align-items:flex-start; gap:.8rem; flex:none;
  min-width:13rem; text-align:left;}
.opt .holds{margin-left:auto; max-width:22rem; font-family:var(--body);
  font-size:.85rem; background:var(--lit); border-color:transparent;}
.opt .holds:hover{border-color:var(--rule);}
.opt .holds:focus{background:#fff; border-color:var(--grease);}
.opt .holds::placeholder{color:#b3babf; font-style:italic;}
@media (max-width:640px){
  .opt{flex-wrap:wrap;}
  .opt .holds{margin:.6rem 0 0; max-width:none; width:100%;}
}

.field{display:block; margin-top:1rem;}
.field span{display:block; font-family:var(--mono); font-size:.64rem;
  letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
  margin-bottom:.4rem;}
input[type=text],input[type=number],select{
  font-family:var(--mono); font-size:.85rem; color:var(--ink); width:100%;
  background:#fff; border:1px solid var(--rule); border-radius:4px;
  padding:.55rem .7rem; transition:border-color .15s;}
select.kind{width:auto; font-size:.7rem; padding:.25rem .4rem;}
input:focus,select:focus{outline:none; border-color:var(--grease);}
.hint{display:block; margin-top:.5rem; font-size:.8rem; color:var(--faint);
  font-family:var(--body); line-height:1.4;}

.acts{display:flex; align-items:center; gap:.8rem; margin-top:1.8rem;
  padding-top:1.2rem; border-top:1px solid var(--rule);}
.ghost{font-family:var(--mono); font-size:.72rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--faint); padding:.8rem 1.1rem;
  border-radius:999px; white-space:nowrap;
  transition:color .15s, background .15s, border-color .15s;}
.ghost:hover{color:var(--ink); background:var(--glass);}
/* Bordered, because this one is not a way out of the panel — it is the only
   way a folder ever gets added, and a bare label does not look pressable. */
.ghost.edged{border:1px solid var(--rule); color:var(--soft);}
.ghost.edged:hover{border-color:var(--grease); color:var(--grease);
  background:none;}
.ghost[disabled]{opacity:.45; cursor:default;}
.go.small{padding:.8rem 1.4rem; font-size:.72rem;}

/* Never a toast: a message that disappears by itself is one a reader can
   miss, and what it reports is whether their change was taken. */
.saved{margin:0 auto 0 0; font-size:.84rem; font-family:var(--body);
  max-width:34ch; line-height:1.35;}
.saved.ok{color:var(--good);}
.saved.bad{color:var(--grease);}

@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<div class="veil" aria-hidden="true">
  <div class="art"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="chaff" id="chaff"></div>
</div>

<div class="app">

  <header class="bar">
    <svg class="mark" viewBox="11 0 49 49" width="26" height="26" role="img" aria-label="winnow">
      <ellipse cx="22" cy="5.5" rx="3" ry="5.7" fill="currentColor"/>
      <ellipse cx="17.9" cy="13" rx="3" ry="5.7" transform="rotate(-28 17.9 13)" fill="currentColor"/>
      <ellipse cx="26.1" cy="13" rx="3" ry="5.7" transform="rotate(28 26.1 13)" fill="currentColor"/>
      <ellipse cx="17.2" cy="21" rx="3" ry="5.7" transform="rotate(-30 17.2 21)" fill="currentColor"/>
      <ellipse cx="26.8" cy="21" rx="3" ry="5.7" transform="rotate(30 26.8 21)" fill="currentColor"/>
      <ellipse cx="16.6" cy="29" rx="3" ry="5.7" transform="rotate(-32 16.6 29)" fill="currentColor"/>
      <ellipse cx="27.4" cy="29" rx="3" ry="5.7" transform="rotate(32 27.4 29)" fill="currentColor"/>
      <ellipse cx="38" cy="21" rx="2.5" ry="3.9" class="grain" style="--i:0" transform="rotate(-46 38 21)"/>
      <ellipse cx="47" cy="13" rx="2.5" ry="3.9" class="grain" style="--i:1" transform="rotate(-30 47 13)"/>
      <ellipse cx="56" cy="6"  rx="2.5" ry="3.9" class="grain" style="--i:2" transform="rotate(-16 56 6)"/>
      <path d="M22 34 V47" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </svg>
    <span class="name">winnow</span>
    <nav class="tabs">
      <button class="tab on" data-go="home">Casa</button>
      <button class="tab" data-go="archive">Archivio</button>
      <button class="tab" data-go="settings">Impostazioni</button>
    </nav>
  </header>

  <section class="screen" id="home">
    <div class="home" id="face">
      <span class="dot" id="dot">…</span>
      <h1 id="headline">Sto guardando</h1>
      <p class="detail" id="detail"></p>
      <button class="go" id="act" disabled>attendi</button>
      <div class="log" id="log" hidden></div>
      <div class="stats" id="stats"></div>
      <p class="purpose">I post che salvi e non riapri mai. Una volta a
        settimana <b>winnow</b> li legge, controlla alla fonte i nomi che
        ci trova, e separa il grano dalla pula.</p>
    </div>
  </section>

  <section class="screen" id="archive" hidden>
    <p class="eyebrow">Le settimane già giudicate</p>
    <div id="archive-body"></div>
  </section>

  <section class="screen" id="settings" hidden>
    <p class="eyebrow">Come lavora</p>
    <div id="settings-body"></div>
  </section>

</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title"></h2>
    <p class="lead" id="sheet-lead"></p>
    <div id="sheet-body"></div>
    <div class="acts">
      <p class="saved" id="saved"></p>
      <button class="ghost" id="sheet-cancel">Annulla</button>
      <button class="go small" id="sheet-save">Salva</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// The shell says so in the URL. Sniffing the user agent would be guessing:
// the same page is served to a browser tab, where there are no traffic lights
// to make room for and the band would just be a dent in the top of the page.
if (new URLSearchParams(location.search).get("native")) {
  document.documentElement.classList.add("native");
}
let job = null, timer = null;

// The grains are built here rather than written out in the markup: each one
// needs its own start, speed and delay, and eight hand-written style
// attributes would be eight things to keep in step by hand.
(function chaff() {
  const box = document.getElementById("chaff");
  for (let i = 0; i < 9; i++) {
    const g = document.createElement("span");
    g.style.left = (4 + Math.random() * 46) + "vw";
    g.style.top = (52 + Math.random() * 46) + "vh";
    // Long and staggered: a burst of grains crossing together would read as
    // an effect, and the point is weather, not an animation.
    g.style.animationDuration = (26 + Math.random() * 22) + "s";
    g.style.animationDelay = (-Math.random() * 40) + "s";
    g.style.transform = "rotate(" + (Math.random() * 180) + "deg)";
    box.appendChild(g);
  }
})();

async function api(path, method = "GET") {
  const r = await fetch(path, { method });
  return { code: r.status, body: await r.json().catch(() => ({})) };
}

// --- home ------------------------------------------------------------------
function paintHome(s) {
  $("face").className = "home s-" + s.state;
  $("dot").textContent = {
    ready: "pronto", nothing_new: "niente di nuovo", busy: "sta lavorando",
    logged_out: "sconnesso", brake: "fermo",
  }[s.state] || s.state;
  $("headline").textContent = s.headline;
  $("detail").textContent = s.detail || "";

  const act = $("act");
  act.disabled = false;
  act.dataset.action = s.action;
  act.innerHTML = s.button + '<span class="arrow">&rarr;</span>';

  const stale = s.stale
    ? '<span class="stat warn"><b>!</b>l\'ultima raccolta è vecchia</span>' : "";
  $("stats").innerHTML =
    `<span class="stat"><b>${s.pending_posts}</b>post in coda</span>` +
    `<span class="stat"><b>${s.pending_days}</b>giorni</span>` +
    `<span class="stat"><b>$${(s.spend_usd || 0).toFixed(2)}</b>questa settimana</span>` +
    stale;
}

async function refresh() {
  const { body } = await api("/api/state");
  if (!job) paintHome(body);
}

// --- a run in flight -------------------------------------------------------
async function follow(id) {
  const { body } = await api("/api/jobs/" + id);
  const log = $("log");
  log.hidden = false;
  log.innerHTML = body.events
    .filter((e) => e.line)
    .map((e) => `<p>${e.line}</p>`).join("");
  log.scrollTop = log.scrollHeight;

  if (body.done) {
    clearInterval(timer);
    job = null;
    if (body.error) {
      log.innerHTML += `<p class="bad">${body.error}</p>`;
    } else if (body.code === 0 && body.kind === "recap") {
      const page = body.events.find((e) => e.kind === "rendered");
      if (page) window.open("/recap/" + page.data.path.split("/").pop(), "_blank");
      loadArchive();
    }
    refresh();
  }
}

$("act").addEventListener("click", async () => {
  const action = $("act").dataset.action;
  $("act").disabled = true;
  if (action === "stop" && job) {
    await api("/api/jobs/" + job + "/stop", "POST");
    return;
  }
  const { code, body } = await api("/api/" + action, "POST");
  if (code === 202) {
    job = body.id;
    $("log").innerHTML = "";
    $("face").className = "home s-busy";
    $("dot").textContent = "sta lavorando";
    $("headline").textContent = action === "recap"
      ? "Sto facendo il recap" : "Sto raccogliendo";
    $("detail").textContent = "";
    $("act").innerHTML = "Ferma";
    $("act").dataset.action = "stop";
    $("act").disabled = false;
    timer = setInterval(() => follow(job), 700);
  } else {
    $("act").disabled = false;
    alert(body.error || "non è partito");
  }
});

// --- archive ---------------------------------------------------------------
async function loadArchive() {
  const { body } = await api("/api/recaps");
  $("archive-body").innerHTML = body.recaps.length
    ? '<div class="cards">' + body.recaps.map((r) =>
        `<button class="card" data-file="${r.file}">` +
        `<b>${r.week}</b><span>${r.size_kb} KB</span></button>`).join("") + "</div>"
    : '<p class="empty">Ancora nessuna settimana giudicata. ' +
      'Il primo recap comparirà qui, e resterà apribile per sempre.</p>';
  document.querySelectorAll(".card").forEach((c) =>
    c.addEventListener("click", () =>
      window.open("/recap/" + c.dataset.file, "_blank")));
}

// --- settings --------------------------------------------------------------
let models = null, config = null, draft = null;

const PENCIL = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M11.3 2.2a1.7 1.7 0 0 1 2.5 2.4L5.4 13 2 14l1-3.4z"/></svg>';

const esc = (t) => String(t ?? "").replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// --- the reading screen ----------------------------------------------------
async function loadSettings() {
  if (!models) models = (await api("/api/models")).body.models || [];
  const { code, body } = await api("/api/config");
  if (code !== 200) {
    $("settings-body").innerHTML =
      '<p class="empty">Nessuna configurazione ancora. Apri un terminale e ' +
      'lancia <code>winnow init</code>: va fatto una volta sola.</p>';
    return;
  }
  config = body;

  const known = models.find((m) => m.model === body.model);
  const folders = (body.folders || []).map((f) =>
    `<span class="pill${f.active ? " on" : ""}"` +
    (f.holds ? ` title="${esc(f.holds)}"` : "") +
    `>${esc(f.name)}</span>`).join("")
    || '<span class="pill">nessuna</span>';
  const on = (body.folders || []).filter((f) => f.active).length;

  const row = (key, value, which) =>
    `<div class="row"><span class="k">${key}</span>` +
    `<span class="v">${value}</span>` +
    (which ? `<button class="edit" data-edit="${which}" ` +
             `title="Modifica ${key.toLowerCase()}" ` +
             `aria-label="Modifica ${key.toLowerCase()}">${PENCIL}</button>` : "") +
    "</div>";

  $("settings-body").innerHTML = '<div class="rows">' +
    row("Modello", esc(known ? known.label : body.model), "model") +
    row("Fornitore", esc(body.provider), null) +
    row("Post per giro", body.posts_per_run, "posts") +
    row("Cartelle", folders + (on ? "" :
        ' <span class="pill">nessuna attiva</span>'), "folders") +
    "</div>";

  $("settings-body").querySelectorAll("[data-edit]").forEach((b) =>
    b.addEventListener("click", () => openSheet(b.dataset.edit)));
}

// --- the sheet -------------------------------------------------------------
function closeSheet() {
  $("sheet").hidden = true;
  draft = null;
  $("saved").textContent = "";
  $("saved").className = "saved";
}

function say(text, bad) {
  const note = $("saved");
  note.className = "saved" + (bad ? " bad" : " ok");
  note.textContent = text;
}

const SHEETS = {
  model: {
    title: "Chi legge le slide",
    lead: "Il modello apre ogni slide e ne tira fuori i nomi. Costa a post: " +
      "con una raccolta da otto post al giorno, mezzo centesimo l'uno fa " +
      "circa un euro al mese.",
    draw: drawModel,
    patch: () => ({ provider: draft.provider, model: draft.model,
                    base_url: draft.base_url || null }),
  },
  posts: {
    title: "Quanti post per giro",
    lead: "Quanti ne apre a ogni raccolta. Più alto smaltisce l'arretrato " +
      "prima, ma ogni giro dura di più e costa di più.",
    draw: drawPosts,
    patch: () => ({ posts_per_run: Number(draft.posts_per_run) }),
  },
  folders: {
    title: "Quali cartelle guardare",
    lead: "Le cartelle dei tuoi salvati su Instagram: winnow legge solo " +
      "quelle accese. Accanto a ognuna scrivi cosa ci tieni dentro — serve " +
      "al modello per leggere i nomi come li leggeresti tu.",
    draw: drawFolders,
    patch: () => ({ folders: draft.folders }),
  },
};

function openSheet(which) {
  const sheet = SHEETS[which];
  // A copy, never the live config: cancelling has to leave nothing behind,
  // and editing the object the reading screen draws from would change that
  // screen before anything was saved.
  draft = JSON.parse(JSON.stringify({
    provider: config.provider, model: config.model,
    base_url: config.base_url, posts_per_run: config.posts_per_run,
    folders: (config.folders || []).map((f) => ({ ...f })),
  }));
  $("sheet-title").textContent = sheet.title;
  $("sheet-lead").textContent = sheet.lead;
  $("sheet").hidden = false;
  $("sheet-save").dataset.which = which;
  sheet.draw();
}

function drawModel() {
  const known = models.some((m) => m.model === draft.model && m.model);
  const rows = models.filter((m) => m.model).map((m) =>
    `<button class="opt${m.model === draft.model ? " on" : ""}" ` +
    `data-model="${esc(m.model)}" data-provider="${esc(m.provider)}">` +
    `<span class="tick"></span><span class="txt"><b>${esc(m.label)}</b>` +
    `<span>${esc(m.hint_it || m.hint)}</span></span></button>`);
  rows.push(
    `<button class="opt${known ? "" : " on"}" data-model="" data-provider="">` +
    '<span class="tick"></span><span class="txt"><b>Un altro modello</b>' +
    "<span>il tuo, sulla tua macchina, o un nome che scrivi a mano</span>" +
    "</span></button>");

  $("sheet-body").innerHTML = `<div class="opts">${rows.join("")}</div>` +
    `<div id="custom"${known ? " hidden" : ""}>` +
      '<label class="field"><span>Nome del modello</span>' +
      `<input type="text" id="m-name" value="${esc(known ? "" : draft.model)}" ` +
      'placeholder="qwen2.5vl"></label>' +
      '<label class="field"><span>Indirizzo</span>' +
      `<input type="text" id="m-url" value="${esc(draft.base_url || "")}" ` +
      'placeholder="http://localhost:11434/v1"></label>' +
      '<span class="hint">Deve saper leggere immagini e parlare l\'API di ' +
      'OpenAI — Ollama, LM Studio. Gira sulla tua macchina, quindi non costa ' +
      'niente e non manda le slide fuori di casa.</span>' +
    "</div>";

  $("sheet-body").querySelectorAll(".opt").forEach((b) =>
    b.addEventListener("click", () => {
      $("sheet-body").querySelectorAll(".opt").forEach(
        (x) => x.classList.remove("on"));
      b.classList.add("on");
      const custom = !b.dataset.model;
      $("custom").hidden = !custom;
      if (custom) {
        draft.provider = "local";
        draft.model = $("m-name").value.trim();
        draft.base_url = $("m-url").value.trim();
      } else {
        draft.provider = b.dataset.provider;
        draft.model = b.dataset.model;
        draft.base_url = null;
      }
    }));
  const sync = () => {
    draft.provider = "local";
    draft.model = $("m-name").value.trim();
    draft.base_url = $("m-url").value.trim();
  };
  $("m-name").addEventListener("input", sync);
  $("m-url").addEventListener("input", sync);
}

function drawPosts() {
  $("sheet-body").innerHTML =
    '<label class="field"><span>Post per giro</span>' +
    `<input type="number" id="ppr" min="1" max="200" value="${draft.posts_per_run}">` +
    '</label><span class="hint">Otto al giorno è il ritmo per cui è tarato. ' +
    "Chi installa winnow dopo anni di salvataggi ne ha centinaia in coda: " +
    "alzarlo per qualche giorno smaltisce l'arretrato, poi si rimette giù." +
    "</span>";
  $("ppr").addEventListener("input",
    (e) => { draft.posts_per_run = e.target.value; });
}

// Examples rather than a taxonomy. Two fixed categories were one person's
// way of sorting their own saved posts; everyone sorts differently, and the
// two words meant nothing to anybody who had not chosen them.
const HOLDS_EXAMPLES = [
  "repo e tool da provare",
  "notizie sull'AI",
  "schede e componenti elettronici",
  "ricette",
  "esercizi e programmi di allenamento",
  "dischi e attrezzatura da studio",
];

function drawFolders() {
  // A row, not a button: it carries a text field, and a field inside a button
  // is invalid markup — every click in it would toggle the folder.
  const rows = draft.folders.map((f, i) =>
    `<div class="opt${f.active ? " on" : ""}" data-row="${i}">` +
    `<button class="pick" data-i="${i}" aria-pressed="${f.active}">` +
      `<span class="tick"></span><span class="txt"><b>${esc(f.name)}</b>` +
      `<span>${f.active ? "winnow la legge" : "ferma"}</span></span></button>` +
    `<input class="holds" data-holds="${i}" maxlength="200" ` +
      `value="${esc(f.holds || "")}" ` +
      `placeholder="${esc(HOLDS_EXAMPLES[i % HOLDS_EXAMPLES.length])}">` +
    "</div>").join("");

  $("sheet-body").innerHTML = `<div class="opts">${rows ||
    '<div class="opt"><span class="txt"><b>Nessuna cartella</b>' +
    "<span>cercale sul tuo account qui sotto</span></span></div>"}</div>` +
    '<div class="acts" style="border:0;padding:0;margin-top:1.1rem">' +
      '<button class="ghost edged" id="scan">Cerca sul tuo account</button>' +
      '<span class="hint" id="scan-note" style="margin:0">Apre Instagram con ' +
      'la sessione salvata e chiede quali cartelle hai. Serve per ' +
      'aggiungerne una: il suo indirizzo non si può indovinare.</span>' +
    "</div>";

  wireFolders();
  $("scan").addEventListener("click", scanFolders);
}

function wireFolders() {
  $("sheet-body").querySelectorAll("[data-i]").forEach((b) =>
    b.addEventListener("click", () => {
      const i = Number(b.dataset.i);
      const f = draft.folders[i];
      f.active = !f.active;
      b.setAttribute("aria-pressed", f.active);
      b.closest(".opt").classList.toggle("on", f.active);
      b.querySelector(".txt span").textContent =
        f.active ? "winnow la legge" : "ferma";
    }));
  // On input, not on change: the sheet is saved by a button somewhere else,
  // and a description typed but never blurred would be silently dropped.
  $("sheet-body").querySelectorAll("[data-holds]").forEach((box) =>
    box.addEventListener("input", () => {
      draft.folders[Number(box.dataset.holds)].holds = box.value;
    }));
}

async function scanFolders() {
  const note = $("scan-note"), button = $("scan");
  button.disabled = true;
  note.textContent = "Sto aprendo Instagram…";
  const { code, body } = await api("/api/folders/scan", "POST");
  if (code !== 202) {
    button.disabled = false;
    note.textContent = body.error || "non riuscito";
    return;
  }
  // Polled like any other run: it drives a real browser and can take a while.
  const tick = setInterval(async () => {
    const { body: j } = await api("/api/jobs/" + body.id);
    if (!j.done) return;
    clearInterval(tick);
    button.disabled = false;
    if (j.error || !j.result) {
      note.textContent = j.error || "non riuscito";
      return;
    }
    const have = new Set(draft.folders.map((f) => f.name));
    const added = j.result.folders.filter((f) => !have.has(f.name));
    // Found ones arrive off. Switching somebody's folders on because a scan
    // happened to see them is deciding for them.
    added.forEach((f) => draft.folders.push(
      { name: f.name, url: f.url, active: false, holds: "" }));
    drawFolders();
    $("scan-note").textContent = added.length
      ? `${added.length} nuove. Accendi quelle che vuoi, poi salva.`
      : "Nessuna nuova: ci sono già tutte.";
  }, 900);
}

$("sheet-cancel").addEventListener("click", closeSheet);
// A click on the scrim is a cancel; one inside the panel is not.
$("sheet").addEventListener("click", (e) => {
  if (e.target === $("sheet")) closeSheet();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("sheet").hidden) closeSheet();
});

$("sheet-save").addEventListener("click", async (e) => {
  // Held in a variable, not read off the event afterwards: `currentTarget` is
  // only set while the event is being dispatched, so the first line after the
  // await found null and the save died silently — the sheet simply never
  // closed, with nothing on screen to say why.
  const button = e.currentTarget;
  const which = button.dataset.which;
  button.disabled = true;
  const r = await fetch("/api/config", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(SHEETS[which].patch()),
  });
  const body = await r.json().catch(() => ({}));
  button.disabled = false;
  if (r.status === 200) {
    closeSheet();
    loadSettings();
    return;
  }
  // The engine's own sentence, shown where the change was made. The sheet
  // stays open with what was typed still in it: closing it would throw the
  // work away at the exact moment the reader has to correct it.
  say(body.error || "non salvato", true);
});

// --- tabs ------------------------------------------------------------------
document.querySelectorAll(".tab").forEach((t) =>
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
    t.classList.add("on");
    ["home", "archive", "settings"].forEach((s) =>
      ($(s).hidden = s !== t.dataset.go));
    if (t.dataset.go === "archive") loadArchive();
    if (t.dataset.go === "settings") loadSettings();
  }));

refresh();
setInterval(() => { if (!job) refresh(); }, 4000);
</script>
</body>
</html>
