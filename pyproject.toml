[project]
name = "winnow"
version = "1.1.0"
description = "Sift the posts you save against who you actually are"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
winnow = "winnow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["winnow*"]

# The recap prompt and the starter profile ship with the package: `winnow
# recap` must work from an installed copy, with no repo checkout in sight.
[tool.setuptools.package-data]
winnow = ["*.md", "*.jpg", "ui/*.html", "ui/*.css", "ui/*.js"]
